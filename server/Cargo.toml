[package]
name = "lattice-server"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[[bin]]
name = "lattice-server"
path = "src/main.rs"
test = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
chrono = "0.4"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "query", "rustls-no-provider", "multipart", "stream", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
walkdir = "2"
log = "0.4"
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
flate2 = "1"
tar = "0.4"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
sha2 = "0.10"
md5 = "0.7"
diffy = "0.5.1"
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots", "handshake"] }
futures-util = { version = "0.3.33", default-features = false, features = ["std", "sink"] }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
rustix = { version = "1", features = ["fs"] }
anydoc = "0.1.9"
lopdf = "0.42"
unicode-normalization = "0.1"
tantivy = { version = "0.27", default-features = false, features = ["mmap", "lz4-compression", "stemmer"] }
jieba-rs = "0.11"
notify = "8"
scraper = "0.27"

clap = { version = "4", features = ["derive"] }
tower-http = { version = "0.6", features = ["fs"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(lattice_beta)'] }

schema_version = "1.1"

[task]
name = "lattice/{{TASK_ID}}"
description = "Repair a LaTeX paper ({{FAMILY}}, {{CATEGORY}}); scored by a pinned pdfLaTeX build."
keywords = ["latex", "{{FAMILY}}", "{{CATEGORY}}"]

[metadata]
family = "{{FAMILY}}"
operator = "{{OPERATOR}}"
category = "{{CATEGORY}}"
tier = {{TIER}}
seed = "{{SEED}}"
generator = "lattice-env {{VERSION}}"

[verifier]
timeout_sec = {{VERIFIER_TIMEOUT}}

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 1200.0
cpus = 1
memory_mb = 2048
storage_mb = 10240

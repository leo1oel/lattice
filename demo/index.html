<!doctype html>
<!--
  The website's interactive demo (tools/web-demo/demo-page.ts): the real app
  over an in-memory backend holding the tutorial. scripts/web-demo.mjs builds
  it into a static folder with relative paths, which the release publishes to
  the website's /demo/.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Try Lattice, a local-first LaTeX writing app for macOS, in your browser." />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="./assets/app-icon-DhjMtHKg.svg" />
    <title>Try Lattice in your browser</title>
    <!--
      What a cold visit sees while the app downloads (several seconds): the
      app's first render into #root replaces it. Inline, since nothing else
      has arrived yet; its colours are demo-chrome.css's fallbacks.
    -->
    <style>
      body { margin: 0; }
      .web-demo-loading {
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #f6f6f4;
        color: #6b6b70;
        font: 500 13px/18px -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif;
      }
      body:has(> .web-demo-bar) .web-demo-loading { height: calc(100vh - var(--web-demo-bar-height, 36px)); }
      .web-demo-loading img { width: 44px; height: 44px; }
      .web-demo-loading-track {
        width: 112px;
        height: 2px;
        border-radius: 1px;
        overflow: hidden;
        background: rgb(0 0 0 / .08);
      }
      .web-demo-loading-track::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: currentColor;
        animation: web-demo-loading 1.1s cubic-bezier(.4, 0, .2, 1) infinite;
      }
      @keyframes web-demo-loading {
        from { transform: translateX(-100%); }
        to { transform: translateX(250%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .web-demo-loading-track::after { width: 100%; opacity: .35; animation: none; }
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-web-demo-theme="light"]) .web-demo-loading { background: #1f1f21; color: #a1a1a6; }
        :root:not([data-web-demo-theme="light"]) .web-demo-loading-track { background: rgb(255 255 255 / .12); }
      }
      :root[data-web-demo-theme="dark"] .web-demo-loading { background: #1f1f21; color: #a1a1a6; }
      :root[data-web-demo-theme="dark"] .web-demo-loading-track { background: rgb(255 255 255 / .12); }
    </style>
    <script type="module" crossorigin src="./assets/demo-B5wRgfZv.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/rolldown-runtime-C0FnF6B9.js">
    <link rel="modulepreload" crossorigin href="./assets/app-P6zFxp2y.js">
    <link rel="stylesheet" crossorigin href="./assets/app-ByayLn9c.css">
  </head>
  <body>
    <div id="root">
      <div class="web-demo-loading" role="status">
        <img src="data:image/svg+xml,%3csvg%20width='1024'%20height='1024'%20viewBox='0%200%201024%201024'%20fill='none'%20xmlns='http://www.w3.org/2000/svg'%3e%3cdefs%3e%3clinearGradient%20id='weft'%20x1='224'%20y1='512'%20x2='800'%20y2='512'%20gradientUnits='userSpaceOnUse'%3e%3cstop%20stop-color='%234E5C1D'/%3e%3cstop%20offset='1'%20stop-color='%236A7A2B'/%3e%3c/linearGradient%3e%3clinearGradient%20id='warp'%20x1='512'%20y1='224'%20x2='512'%20y2='800'%20gradientUnits='userSpaceOnUse'%3e%3cstop%20stop-color='%23AEB763'/%3e%3cstop%20offset='1'%20stop-color='%23909E42'/%3e%3c/linearGradient%3e%3c/defs%3e%3crect%20x='42'%20y='42'%20width='940'%20height='940'%20rx='224'%20fill='%23F7F2E8'/%3e%3crect%20x='43'%20y='43'%20width='938'%20height='938'%20rx='223'%20stroke='%2323211E'%20stroke-opacity='0.1'%20stroke-width='2'/%3e%3cg%20transform='rotate(45%20512%20512)'%3e%3cg%20fill='none'%20stroke='url(%23weft)'%20stroke-width='68'%20stroke-linecap='round'%3e%3cpath%20d='M250%20336H774'/%3e%3cpath%20d='M250%20512H774'/%3e%3cpath%20d='M250%20688H774'/%3e%3c/g%3e%3cg%20fill='none'%20stroke='url(%23warp)'%20stroke-width='68'%20stroke-linecap='butt'%3e%3cpath%20d='M336%20250V478'/%3e%3cpath%20d='M336%20546V774'/%3e%3cpath%20d='M512%20250V302'/%3e%3cpath%20d='M512%20370V654'/%3e%3cpath%20d='M512%20722V774'/%3e%3cpath%20d='M688%20250V478'/%3e%3cpath%20d='M688%20546V774'/%3e%3c/g%3e%3cg%20fill='url(%23warp)'%3e%3ccircle%20cx='336'%20cy='250'%20r='34'/%3e%3ccircle%20cx='336'%20cy='774'%20r='34'/%3e%3ccircle%20cx='512'%20cy='250'%20r='34'/%3e%3ccircle%20cx='512'%20cy='774'%20r='34'/%3e%3ccircle%20cx='688'%20cy='250'%20r='34'/%3e%3ccircle%20cx='688'%20cy='774'%20r='34'/%3e%3c/g%3e%3c/g%3e%3c/svg%3e" alt="" />
        <span id="web-demo-loading-label">Loading the Lattice demo…</span>
        <div class="web-demo-loading-track"></div>
      </div>
    </div>
    <script>
      // The placeholder in the appearance and language the page was asked
      // for, as demo-page.ts reads `?theme` and `?lang`.
      (() => {
        const params = new URLSearchParams(location.search);
        const theme = params.get("theme");
        const asked = theme === "light" || theme === "dark";
        if (asked) document.documentElement.dataset.webDemoTheme = theme;
        // The app's own attribute, as its first render sets it: its
        // stylesheet arrives before that, and would draw the bar above in the
        // light palette meanwhile.
        document.documentElement.dataset.theme = asked ? theme : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        const lang = params.get("lang");
        if (lang === "zh-CN" || (lang !== "en" && navigator.language.toLowerCase().startsWith("zh"))) {
          document.documentElement.lang = "zh-CN";
          document.getElementById("web-demo-loading-label").textContent = "正在载入 Lattice 演示…";
        }
      })();
    </script>
    <script src="./polyfills.js"></script>
  </body>
</html>

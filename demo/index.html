<!doctype html>
<!--
  The website's interactive demo (tools/web-demo/demo-page.ts): the real app
  over an in-memory backend holding the tutorial. scripts/web-demo.mjs builds
  it into a static folder with relative paths, which the release publishes to
  the website's /demo/.
-->

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Try Lattice, a local-first LaTeX writing app for macOS, in your browser." />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="./assets/app-icon-Dp3s_p_l.svg" />
    <title>Try Lattice in your browser</title>
    <!--
      What a cold visit sees while the app downloads (several seconds): the
      app's first render into #root replaces it. Inline, since nothing else
      has arrived yet; its colours are demo-chrome.css's fallbacks.
    -->
    <style>
      body { margin: 0; }
      .web-demo-loading {
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #f6f6f4;
        color: #6b6b70;
        font: 500 13px/18px -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif;
      }
      body:has(> .web-demo-bar) .web-demo-loading { height: calc(100vh - var(--web-demo-bar-height, 36px)); }
      .web-demo-loading img { width: 44px; height: 44px; }
      .web-demo-loading-track {
        width: 112px;
        height: 2px;
        border-radius: 1px;
        overflow: hidden;
        background: rgb(0 0 0 / .08);
      }
      .web-demo-loading-track::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: currentColor;
        animation: web-demo-loading 1.1s cubic-bezier(.4, 0, .2, 1) infinite;
      }
      @keyframes web-demo-loading {
        from { transform: translateX(-100%); }
        to { transform: translateX(250%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .web-demo-loading-track::after { width: 100%; opacity: .35; animation: none; }
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-web-demo-theme="light"]) .web-demo-loading { background: #1f1f21; color: #a1a1a6; }
        :root:not([data-web-demo-theme="light"]) .web-demo-loading-track { background: rgb(255 255 255 / .12); }
      }
      :root[data-web-demo-theme="dark"] .web-demo-loading { background: #1f1f21; color: #a1a1a6; }
      :root[data-web-demo-theme="dark"] .web-demo-loading-track { background: rgb(255 255 255 / .12); }
    </style>
    <script type="module" crossorigin src="./assets/demo-DCqT4o-z.js"></script>

    <link rel="stylesheet" crossorigin href="./assets/app-ByayLn9c.css">

    <script>
      // The placeholder in the appearance and language the page was asked
      // for, as demo-page.ts reads `?theme` and `?lang`.
      (() => {
        const params = new URLSearchParams(location.search);
        const theme = params.get("theme");
        const asked = theme === "light" || theme === "dark";
        if (asked) document.documentElement.dataset.webDemoTheme = theme;
        // The app's own attribute, as its first render sets it: its
        // stylesheet arrives before that, and would draw the bar above in the
        // light palette meanwhile.
        document.documentElement.dataset.theme = asked ? theme : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        const lang = params.get("lang");
        if (lang === "zh-CN" || (lang !== "en" && navigator.language.toLowerCase().startsWith("zh"))) {
          document.documentElement.lang = "zh-CN";
          document.getElementById("web-demo-loading-label").textContent = "正在载入 Lattice 演示…";
        }
      })();
    </script>

# Both CI workflows build with `dtolnay/rust-toolchain@stable`, so this repo
# does too — otherwise a machine pinned to an older default (rustup's global
# setting, which other projects may need) runs a clippy that misses lints CI
# fails on, and a release goes out with CI red.
[toolchain]
channel = "stable"
components = ["clippy", "rustfmt"]
targets = ["aarch64-apple-darwin"]

name = "Markdown"
grammar = "markdown"
path_suffixes = ["md"]
block_comment = ["<!-- ", " -->"]
autoclose_before = ";:.,=}])>"
brackets = [
    { start = "{", end = "}", close = true, newline = false },
    { start = "[", end = "]", close = true, newline = false },
    { start = "(", end = ")", close = true, newline = false },
    { start = "`", end = "`", close = false, newline = false },
]
soft_wrap = "editor_width"

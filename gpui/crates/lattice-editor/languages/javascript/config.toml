name = "JavaScript"
grammar = "javascript"
path_suffixes = ["js", "mjs", "cjs"]
line_comments = ["// "]
block_comment = { start = "/* ", prefix = "", end = " */", tab_size = 0 }
autoclose_before = ";:.,=}])>"
brackets = [
    { start = "{", end = "}", close = true, newline = true },
    { start = "[", end = "]", close = true, newline = true },
    { start = "(", end = ")", close = true, newline = true },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
    { start = "'", end = "'", close = true, newline = false, not_in = ["string", "comment"] },
    { start = "`", end = "`", close = true, newline = false, not_in = ["string", "comment"] },
]
word_characters = ["$", "#"]

[package]
name = "lattice-editor"
version = "0.1.0"
description = "Lattice's editor adapter over Zed's editor: decorations, gutter marks, block widgets, hover cards, completion sources and remote cursors, with the LaTeX language and Lattice's LaTeX extensions on it."
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
# The interface languages (English, Simplified Chinese).
lattice-i18n.workspace = true
anyhow.workspace = true
codebook-tree-sitter-latex.workspace = true
editor.workspace = true
futures.workspace = true
gpui.workspace = true
gpui-kit.workspace = true
language.workspace = true
lattice-core.workspace = true
lattice-ui.workspace = true
log.workspace = true
# Completion items are Zed's `project::Completion`, which the editor's
# completion menu draws; already in the graph through the editor.
project.workspace = true
# The Tauri app's LaTeX patterns (src/editor/latex/latex-symbols.ts) need no
# lookaround; already in the graph through Zed.
regex = "1"
theme.workspace = true

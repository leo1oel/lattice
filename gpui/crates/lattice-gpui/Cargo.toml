[package]
name = "lattice-gpui"
version = "0.1.0"
description = "GPUI prototype of Lattice's LaTeX writing flow: file tree, Zed's editor, PDF preview, latexmk builds, dockable panels."
edition.workspace = true
publish.workspace = true
license.workspace = true

[features]
# The `shot` scenario draws the window itself and reads the frame back from
# Metal, so a look review can be captured with the screen locked or the window
# covered. GPUI exposes that read-back only to its test support, so this is
# never part of a release build.
offscreen-shots = ["gpui/test-support", "gpui_platform/test-support"]

[dependencies]
anyhow.workspace = true
assets.workspace = true
codebook-tree-sitter-latex.workspace = true
dirs.workspace = true
editor.workspace = true
# The Tauri app's figure-path patterns use lookahead (moved_paths.rs).
fancy-regex = "0.19"
futures.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
gpui-kit.workspace = true
# Unused for now, kept on purpose as the graph check that its `gpui-fast`
# feature agrees with GPUI Kit's and adds no second GPUI, until the first
# webview island (the Agent, the HTML and slide viewers) uses it.
gpui-webview.workspace = true
hdrhistogram = { version = "7", default-features = false }
image.workspace = true
language.workspace = true
lattice-core.workspace = true
lattice-editor.workspace = true
lattice-i18n.workspace = true
lattice-settings.workspace = true
lattice-ui.workspace = true
log.workspace = true
pdfium-render.workspace = true
# The Tauri app's TeX message and word patterns (crate::build).
regex = "1"
release_channel.workspace = true
search.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
settings.workspace = true
smallvec.workspace = true
theme.workspace = true
theme_settings.workspace = true
vim.workspace = true
vim_mode_setting.workspace = true
workspace.workspace = true
zed_actions.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSGeometry", "NSLocale", "NSString"] }

# The version Zed's gpui_windows already uses, so it adds no crate.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

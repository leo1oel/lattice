<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HTML preview</title>
<style>
  /* The Tauri app's `.html-preview` and `.html-preview-frame`
     (src/styles/editor-workspace.css): an authored page on white, its own
     scrollbar hidden behind the frame's right edge (the host draws Lattice's
     over it), whatever the app's theme. */
  html, body { margin: 0; height: 100%; overflow: hidden; background: white; }
  iframe { display: block; width: 100%; height: 100%; border: 0; background: white; }
  @media (pointer: fine) { iframe { width: calc(100% + 10px); } }
</style>
</head>
<body>
<iframe id="frame" sandbox="allow-scripts" referrerpolicy="no-referrer" title="HTML preview"></iframe>
<script src="html-preview.js"></script>
</body>
</html>

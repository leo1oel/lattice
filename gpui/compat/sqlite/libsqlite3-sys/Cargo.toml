[package]
name = "libsqlite3-sys"
version = "0.30.1"
description = "libsqlite3-sys 0.38 (the version lattice-core's rusqlite links) under the version Zed's sqlez asks for."
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"

[lib]
name = "libsqlite3_sys"
path = "lib.rs"
doctest = false

[features]
default = ["sqlite/default"]
bundled = ["sqlite/bundled"]

[dependencies]
sqlite = { package = "libsqlite3-sys", version = "0.38.1" }

[package]
name = "gpui-pre-macros"
version = "0.3.12"
description = "The workspace's `gpui_macros` (Zed's, patched to gpui-fast) under the name and version of the gpui-pre snapshot GPUI Kit pins."
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"

[lib]
name = "gpui_macros"
path = "lib.rs"
doctest = false

[features]
inspector = ["zed_gpui_macros/inspector"]

[dependencies]
zed_gpui_macros = { package = "gpui_macros", git = "https://github.com/zed-industries/zed", rev = "d2a4fb6ded7c470be25d1541281da3882495b65b" }

[package]
name = "gpui-pre-platform"
version = "0.3.12"
description = "Zed's in-tree `gpui_platform` under the name and version of the gpui-pre snapshot GPUI Kit pins."
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"

[lib]
name = "gpui_platform"
path = "lib.rs"
doctest = false

[features]
default = ["zed_gpui_platform/default"]
bench-support = ["zed_gpui_platform/bench-support"]
font-kit = ["zed_gpui_platform/font-kit"]
inspector = ["zed_gpui_platform/inspector"]
multithreaded = ["zed_gpui_platform/multithreaded"]
runtime_shaders = ["zed_gpui_platform/runtime_shaders"]
screen-capture = ["zed_gpui_platform/screen-capture"]
test-support = ["zed_gpui_platform/test-support"]
wayland = ["zed_gpui_platform/wayland"]
x11 = ["zed_gpui_platform/x11"]

[dependencies]
zed_gpui_platform = { package = "gpui_platform", git = "https://github.com/zed-industries/zed", rev = "d2a4fb6ded7c470be25d1541281da3882495b65b", default-features = false }

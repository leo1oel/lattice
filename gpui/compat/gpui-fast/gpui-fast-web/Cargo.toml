[package]
name = "gpui-fast-web"
version = "0.1.14"
description = "The workspace's `gpui_web` under the name and version GPUI Kit's `gpui-fast` feature asks for (wasm only)."
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"

[lib]
name = "gpui_web"
path = "lib.rs"
doctest = false

[features]
default = []
multithreaded = ["zed_gpui_web/multithreaded"]

[dependencies]
zed_gpui_web = { package = "gpui_web", git = "https://github.com/zed-industries/zed", rev = "d2a4fb6ded7c470be25d1541281da3882495b65b", default-features = false }

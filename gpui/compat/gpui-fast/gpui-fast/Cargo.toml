[package]
name = "gpui-fast"
version = "0.1.14"
description = "The workspace's `gpui` (Zed's, patched to gpui-fast) under the name and version GPUI Kit's `gpui-fast` feature asks for."
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"

[lib]
name = "gpui"
path = "lib.rs"
doctest = false

[features]
default = ["zed_gpui/default"]
bench = ["zed_gpui/bench"]
bench-support = ["zed_gpui/bench-support"]
font-kit = ["zed_gpui/font-kit"]
hot-reload = ["zed_gpui/hot-reload"]
inspector = ["zed_gpui/inspector"]
leak-detection = ["zed_gpui/leak-detection"]
profiler = ["zed_gpui/profiler"]
screen-capture = ["zed_gpui/screen-capture"]
stacker = ["zed_gpui/stacker"]
test-support = ["zed_gpui/test-support"]
wayland = ["zed_gpui/wayland"]
windows-manifest = ["zed_gpui/windows-manifest"]
# GPUI Kit asks for this because the real gpui-pre embeds the Windows
# manifest. Here the one GPUI embeds it itself (its default `windows-manifest`
# feature), so forwarding the request would leave the app with none.
windows-manifest-provided-by-host = []
x11 = ["zed_gpui/x11"]

[dependencies]
zed_gpui = { package = "gpui", git = "https://github.com/zed-industries/zed", rev = "d2a4fb6ded7c470be25d1541281da3882495b65b", default-features = false }

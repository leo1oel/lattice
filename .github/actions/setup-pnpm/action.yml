name: Set up pnpm
description: >
  pnpm 10 on Node 22 with the pnpm store cached, then a frozen install of one
  pnpm project (the root by default; literature-worker and
  tools/open-slide-runtime are projects of their own).
inputs:
  project:
    description: Directory of the pnpm project to install.
    default: "."
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
      with:
        version: 10
        # The default, ~/setup-pnpm, is the owner's home on a self-hosted Mac.
        dest: ${{ runner.temp }}/setup-pnpm
    - uses: actions/setup-node@v7
      with:
        # Matches mise.toml's `node`, which local `pnpm check` runs on.
        node-version: 22
    # The store is restored on every ref but saved from main only. setup-node's
    # own `cache: pnpm` saved a 250-300 MB store from every branch that ran,
    # visible to that branch alone, which kept the repository's 10 GB Actions
    # cache over its limit (10.7 GB on 2026-11-18) and evicted the caches every
    # run needs, MiKTeX's among them (gpui.yml run 44171052878).
    - id: store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
    # GitHub's runners only: on a self-hosted Mac (release.yml through
    # runner-up) pnpm uses the owner's store, and a restore would unpack into it.
    - id: restore
      if: runner.environment == 'github-hosted'
      uses: actions/cache/restore@v5
      with:
        path: ${{ steps.store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ inputs.project }}-${{ hashFiles(format('{0}/pnpm-lock.yaml', inputs.project)) }}
        restore-keys: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ inputs.project }}-
    - run: pnpm --dir "${{ inputs.project }}" install --frozen-lockfile
      shell: bash
    - if: runner.environment == 'github-hosted' && github.ref == 'refs/heads/main' && steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: ${{ steps.store.outputs.path }}
        key: ${{ steps.restore.outputs.cache-primary-key }}

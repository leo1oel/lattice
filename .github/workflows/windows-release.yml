name: Publish Windows installer
on:
  push:
    branches: [windows-port]
    paths: [.github/workflows/windows-release.yml]
  workflow_dispatch:
    inputs:
      build_run:
        description: Successful Windows build run containing the installer
        required: true
        type: string
      release_tag:
        description: Existing release tag receiving the installer
        required: true
        type: string
      asset_name:
        description: Published installer filename ending in .exe
        required: true
        type: string
      sha256:
        description: Expected SHA-256 of the installer
        required: true
        type: string
permissions:
  actions: read
  contents: write
jobs:
  upload:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: Lattice-Windows-x64
          path: installer
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run }}
      - name: Verify and upload the tested installer to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ASSET_NAME: ${{ inputs.asset_name }}
          EXPECTED_SHA256: ${{ inputs.sha256 }}
        run: |
          [[ "$ASSET_NAME" =~ ^[A-Za-z0-9._-]+\.exe$ ]]
          [[ "$EXPECTED_SHA256" =~ ^[a-f0-9]{64}$ ]]
          mv installer/Lattice_0.15.8_x64-setup.exe "$ASSET_NAME"
          printf '%s  %s\n' "$EXPECTED_SHA256" "$ASSET_NAME" > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          gh release upload "$RELEASE_TAG" "$ASSET_NAME" SHA256SUMS.txt --clobber

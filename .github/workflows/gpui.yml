name: GPUI

# The GPUI preview app in gpui/ is a Cargo workspace of its own, built from
# Zed's crates (about 1,200 of them), and nothing in the Tauri app depends on
# it. So this workflow runs only when gpui/ or this file changes, and CI's
# Tauri jobs (ci.yml) skip a pull request that changes nothing else. The app
# builds on the backend crate it shares with the Tauri app
# (src-tauri/lattice-core), so a change there runs it too. The other files
# outside gpui/ it reads are the design system's exports:
# gpui/crates/lattice-ui generates its tokens from tokens.json (Paper's) and
# its Zed editor themes from code-themes.json, and fails a test while either
# disagrees with what it generated, so a Paper export runs this workflow too.
# code-themes.json is in turn generated from the app's code themes
# (src/settings/code-themes.ts, with the contrast fitting in
# theme-customization.ts) by design-system/code-themes.mjs, so a change to
# any of those runs it, and the code-themes job fails while the JSON is stale.
# The macos job also writes the parity report (gpui/parity/), which stages
# its scenes with design-system/screens/, so a change there runs it too; a
# change to the Tauri frontend itself does not, to keep this workflow off
# every frontend pull request.
on:
  push:
    branches: [main]
    paths: &gpui-paths
      - "gpui/**"
      - "src-tauri/lattice-core/**"
      - "design-system/tokens.json"
      - "design-system/code-themes.json"
      - "design-system/code-themes.mjs"
      - "src/settings/code-themes.ts"
      - "src/settings/theme-customization.ts"
      - "design-system/screens/**"
      - ".github/actions/setup-pnpm/**"
      - ".github/workflows/gpui.yml"
  pull_request:
    paths: *gpui-paths
  workflow_dispatch:

concurrency:
  group: gpui-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: gpui

env:
  CARGO_TERM_COLOR: always
  # Incremental state is several GB that a fresh checkout never reuses.
  CARGO_INCREMENTAL: "0"
  # Zed's repository is large; the git CLI fetches it faster than libgit2.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

# Everything builds in the release profile, as users run it: a dev build of
# Zed's assets crate reads its files from the Zed checkout at run time instead
# of embedding them, and finds none from this workspace. Cold, the release
# build took 31 minutes on macOS and 28 on Windows (2026-11-11); everything
# after it takes about two.
#
# The Rust caches are written from main only, and only when their key (the
# lockfile, the toolchain, this job) changes, because the repository's 10 GB
# Actions cache also holds the Tauri release cache that tag builds restore. A
# pull request reads main's cache and writes none.
jobs:
  # The export imports only the two TypeScript modules, which import nothing
  # at run time, so Node alone runs it: no pnpm install.
  code-themes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Matches mise.toml's `node`; 22.18 and later run TypeScript.
          node-version: 22
      - run: node design-system/code-themes.mjs --check

  # gpui/patches holds upstream crates with Lattice's diffs; this rebuilds
  # them from upstream at their pins and fails unless they match.
  patches:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: script/check-patches

  macos:
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      # Installs the release gpui/rust-toolchain.toml pins.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gpui
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all -- --check
      - run: script/fetch-pdfium
      - run: cargo build --release --locked
      # A small TeX Live on PATH, where the app looks first.
      - name: Install TeX Live
        uses: TeX-Live/setup-texlive-action@v4
        with:
          cache: false
          packages: |
            scheme-basic
            latexmk
      # --include-ignored runs the latexmk build test, which needs TeX.
      - run: cargo test --release --locked --workspace -- --include-ignored
      - name: e2e scenario
        timeout-minutes: 10
        run: |
          project="$RUNNER_TEMP/e2e-project"
          cp -R fixtures/e2e "$project"
          target/release/lattice-gpui "$project" --scenario e2e --out "$RUNNER_TEMP/e2e-macos.json"
          cat "$RUNNER_TEMP/e2e-macos.json"
          jq -e '.passed == true' "$RUNNER_TEMP/e2e-macos.json" > /dev/null
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: gpui-e2e-macos
          path: ${{ runner.temp }}/e2e-macos.json
          if-no-files-found: ignore
      # The parity report (gpui/README.md, "Parity harness"): the Main window
      # in light and dark, against the Tauri frontend on the mock-backend
      # page, region by region and pixel by pixel. A report for now, not a
      # gate: these steps never fail the job. The runner's screen shrinks the
      # window (about 1015 px wide), and the reference is drawn at whatever
      # size and scale the GPUI window got.
      - name: Set up pnpm for the parity report
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: ./.github/actions/setup-pnpm
      - name: Parity report
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 15
        working-directory: .
        run: |
          pnpm exec playwright-core install chromium
          node --test gpui/parity/*.test.mjs
          node gpui/parity/run.mjs --out "$RUNNER_TEMP/parity" --app gpui/target/release/lattice-gpui
          sed '/^!\[/d' "$RUNNER_TEMP/parity/report.md" >> "$GITHUB_STEP_SUMMARY"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: gpui-parity-macos
          path: |
            ${{ runner.temp }}/parity/*.md
            ${{ runner.temp }}/parity/*.json
            ${{ runner.temp }}/parity/*.png
            ${{ runner.temp }}/parity/runs/*.json
          if-no-files-found: ignore

  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
        working-directory: gpui
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gpui
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: script/fetch-pdfium.ps1
      - run: cargo build --release --locked
      # MiKTeX's latexmk is a Perl script; the runner's Strawberry Perl runs
      # it. Packages the documents need are installed on first use, without
      # the prompt a desktop install shows.
      - name: Install MiKTeX
        timeout-minutes: 15
        run: |
          choco install miktex --no-progress -y
          $bin = @("C:\Program Files\MiKTeX\miktex\bin\x64", "$env:LOCALAPPDATA\Programs\MiKTeX\miktex\bin\x64") |
            Where-Object { Test-Path "$_\initexmf.exe" } | Select-Object -First 1
          if (-not $bin) { throw "MiKTeX's binaries were not found after the install" }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$bin\initexmf.exe" --admin --set-config-value=[MPM]AutoInstall=1
          & "$bin\miktex.exe" --admin packages update-package-database
          & "$bin\miktex.exe" --admin packages install latexmk
          & "$bin\latexmk.exe" --version
      - run: cargo test --release --locked --workspace -- --include-ignored
      # The scenario posts window messages, so it needs no foreground window
      # or unlocked console; the runner's session gives GPUI a window, and
      # Direct3D falls back to WARP without a GPU.
      - name: e2e scenario
        timeout-minutes: 15
        run: |
          $project = Join-Path $env:RUNNER_TEMP "e2e-project"
          $out = Join-Path $env:RUNNER_TEMP "e2e-windows.json"
          Copy-Item -Recurse fixtures/e2e $project
          $env:LATTICE_GPUI_LOG = "info"
          $env:RUST_BACKTRACE = "1"
          $app = Start-Process -FilePath target/release/lattice-gpui.exe `
            -ArgumentList $project, "--scenario", "e2e", "--out", $out `
            -NoNewWindow -PassThru
          if (-not $app.WaitForExit(600000)) { $app.Kill(); throw "the e2e scenario did not finish in 10 minutes" }
          Get-Content $out
          if (-not (Get-Content $out -Raw | ConvertFrom-Json).passed) { throw "the e2e scenario failed" }
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: gpui-e2e-windows
          path: ${{ runner.temp }}/e2e-windows.json
          if-no-files-found: ignore

  # The windows job builds with MiKTeX; this one runs the TeX crate's tests,
  # the latexmk build included, against TeX Live on Windows. It compiles only
  # that crate, so it needs no Rust cache.
  windows-texlive:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: TeX-Live/setup-texlive-action@v4
        with:
          cache: false
          packages: |
            scheme-basic
            latexmk
      - run: cargo test --locked -p tex -- --include-ignored

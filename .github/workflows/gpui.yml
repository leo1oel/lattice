name: GPUI

# The GPUI preview app in gpui/ is a Cargo workspace of its own, built from
# Zed's crates (about 1,200 of them), and nothing in the Tauri app depends on
# it. So this workflow runs only when gpui/ or this file changes, and CI's
# Tauri jobs (ci.yml) skip a pull request that changes nothing else.
on:
  push:
    branches: [main]
    paths: &gpui-paths
      - "gpui/**"
      - ".github/workflows/gpui.yml"
  pull_request:
    paths: *gpui-paths
  workflow_dispatch:

concurrency:
  group: gpui-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: gpui

env:
  CARGO_TERM_COLOR: always
  # Incremental state is several GB that a fresh checkout never reuses.
  CARGO_INCREMENTAL: "0"
  # Zed's repository is large; the git CLI fetches it faster than libgit2.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

# Everything builds in the dev profile, which gpui/Cargo.toml strips of debug
# info: the e2e scenario checks behaviour, not speed, and an unoptimised build
# of the Zed stack takes about half as long as a release one.
#
# The Rust caches are written from main only, and only when their key (the
# lockfile, the toolchain, this job) changes, because the repository's 10 GB
# Actions cache also holds the Tauri release cache that tag builds restore. A
# pull request reads main's cache and writes none.
jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      # Installs the release gpui/rust-toolchain.toml pins.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gpui
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all -- --check
      - run: script/fetch-pdfium
      - run: cargo build --locked
      # BasicTeX is a small TeX Live with latexmk; the app finds
      # /Library/TeX/texbin the way Lattice does.
      - name: Install BasicTeX
        timeout-minutes: 10
        run: brew install --cask basictex
      # --include-ignored runs the latexmk build test, which needs TeX.
      - run: cargo test --locked --workspace -- --include-ignored
      - name: e2e scenario
        timeout-minutes: 10
        run: |
          project="$RUNNER_TEMP/e2e-project"
          cp -R fixtures/e2e "$project"
          target/debug/lattice-gpui "$project" --scenario e2e --out "$RUNNER_TEMP/e2e-macos.json"
          cat "$RUNNER_TEMP/e2e-macos.json"
          jq -e '.passed == true' "$RUNNER_TEMP/e2e-macos.json" > /dev/null
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: gpui-e2e-macos
          path: ${{ runner.temp }}/e2e-macos.json
          if-no-files-found: ignore

  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
        working-directory: gpui
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gpui
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: script/fetch-pdfium.ps1
      - run: cargo build --locked
      # MiKTeX's latexmk is a Perl script; the runner's Strawberry Perl runs
      # it. Packages the documents need are installed on first use, without
      # the prompt a desktop install shows.
      - name: Install MiKTeX
        timeout-minutes: 15
        run: |
          choco install miktex --no-progress -y
          $bin = @("C:\Program Files\MiKTeX\miktex\bin\x64", "$env:LOCALAPPDATA\Programs\MiKTeX\miktex\bin\x64") |
            Where-Object { Test-Path "$_\initexmf.exe" } | Select-Object -First 1
          if (-not $bin) { throw "MiKTeX's binaries were not found after the install" }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$bin\initexmf.exe" --admin --set-config-value=[MPM]AutoInstall=1
          & "$bin\miktex.exe" --admin packages update-package-database
          & "$bin\miktex.exe" --admin packages install latexmk
          & "$bin\latexmk.exe" --version
      - run: cargo test --locked --workspace -- --include-ignored
      # The scenario posts window messages, so it needs no foreground window
      # or unlocked console; the runner's session gives GPUI a window, and
      # Direct3D falls back to WARP without a GPU.
      - name: e2e scenario
        timeout-minutes: 15
        run: |
          $project = Join-Path $env:RUNNER_TEMP "e2e-project"
          $out = Join-Path $env:RUNNER_TEMP "e2e-windows.json"
          Copy-Item -Recurse fixtures/e2e $project
          $env:LATTICE_GPUI_LOG = "info"
          $app = Start-Process -FilePath target/debug/lattice-gpui.exe `
            -ArgumentList $project, "--scenario", "e2e", "--out", $out `
            -NoNewWindow -PassThru
          if (-not $app.WaitForExit(600000)) { $app.Kill(); throw "the e2e scenario did not finish in 10 minutes" }
          Get-Content $out
          if (-not (Get-Content $out -Raw | ConvertFrom-Json).passed) { throw "the e2e scenario failed" }
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: gpui-e2e-windows
          path: ${{ runner.temp }}/e2e-windows.json
          if-no-files-found: ignore

  # The windows job builds with MiKTeX; this one runs the TeX crate's tests,
  # the latexmk build included, against TeX Live on Windows. It compiles only
  # that crate, so it needs no Rust cache.
  windows-texlive:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: TeX-Live/setup-texlive-action@v4
        with:
          cache: false
          packages: |
            scheme-basic
            latexmk
      - run: cargo test --locked -p tex -- --include-ignored

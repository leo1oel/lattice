name: GPUI

# The GPUI preview app in gpui/ is a Cargo workspace of its own, built from
# Zed's crates (about 1,200 of them), and nothing in the Tauri app depends on
# it. Its builds take 30-60 minutes a run, so pull requests and pushes to main
# do not run this workflow; the optional local `pnpm signoff`
# (docs/agent-validation.md) runs the GPUI unit tests and the e2e scenario
# when a change touches gpui/. It runs for a release tag, on demand (Actions > GPUI > Run
# workflow), and weekly on main, which is what keeps its Rust caches warm.
#
# The app builds on the backend crate it shares with the Tauri app
# (src-tauri/lattice-core). The other files outside gpui/ it reads are the
# design system's exports: gpui/crates/lattice-ui generates its tokens from
# tokens.json (Paper's) and its Zed editor themes from code-themes.json, and
# fails a test while either disagrees with what it generated.
# code-themes.json is in turn generated from the app's code themes
# (src/settings/code-themes.ts, with the contrast fitting in
# theme-customization.ts) by design-system/code-themes.mjs, and the
# code-themes job fails while the JSON is stale. The macos job also writes the
# parity report (gpui/parity/), which stages its scenes with
# design-system/screens/.
on:
  push:
    tags: ["v*"]
  schedule:
    # Monday 06:41 UTC, away from the hour and from ci.yml's weekly run.
    - cron: "41 6 * * 1"
  workflow_dispatch:

concurrency:
  group: gpui-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    working-directory: gpui

env:
  CARGO_TERM_COLOR: always
  # Incremental state is several GB that a fresh checkout never reuses.
  CARGO_INCREMENTAL: "0"
  # Zed's repository is large; the git CLI fetches it faster than libgit2.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

# Everything builds in the release profile, as users run it: a dev build of
# Zed's assets crate reads its files from the Zed checkout at run time instead
# of embedding them, and finds none from this workspace. Cold, the release
# build took 31 minutes on macOS and 28 on Windows (2026-11-11); everything
# after it takes about two.
#
# The Rust caches are written from main only (the weekly run, or a dispatch
# there), and only when their key (the lockfile, the toolchain, this job)
# changes, because the repository's 10 GB Actions cache also holds the Tauri
# release cache that tag builds restore. A tag run reads main's cache and
# writes none, since a cache written from a tag is visible to that tag alone.
# They are written even when a test fails: the compiled crates are what the
# next run needs, and a red test does not make them wrong.
jobs:
  # The export imports only the two TypeScript modules, which import nothing
  # at run time, so Node alone runs it: no pnpm install.
  code-themes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Matches mise.toml's `node`; 22.18 and later run TypeScript.
          node-version: 22
      - run: node design-system/code-themes.mjs --check

  # gpui/patches holds upstream crates with Lattice's diffs; this rebuilds
  # them from upstream at their pins and fails unless they match.
  patches:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: script/check-patches

  macos:
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      # Installs the release gpui/rust-toolchain.toml pins.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gpui
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - run: cargo fmt --all -- --check
      - run: script/fetch-pdfium
      - run: cargo build --release --locked
      # A small TeX Live on PATH, where the app looks first. scheme-basic has
      # no `synctex` binary (its own package, as in lattice-core's TeX Live
      # install), and the e2e scenario's SyncTeX steps run it.
      - name: Install TeX Live
        uses: TeX-Live/setup-texlive-action@v4
        with:
          cache: false
          packages: |
            scheme-basic
            latexmk
            synctex
      # TexLab, for the editor's diagnostics, which the e2e scenario checks
      # (the Windows job has none and skips that step).
      - name: Install TexLab
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install texlab
      # --include-ignored runs the latexmk build test, which needs TeX.
      - run: cargo test --release --locked --workspace -- --include-ignored
      # The scenario ends by quitting with text typed and not yet saved
      # (its result's `after_quit`); once the app has exited, the file must
      # hold that text. A PDF step that finds the window drawing no frames
      # captures the screen once, to show what was in front of it.
      # The editor-adapter steps wait for the window to paint carets, gutter
      # marks and cards. A CAMetalDisplayLink stops delivering frames once
      # the runner's display stops compositing the window, which left those
      # steps with nothing painted partway through; the lab switch
      # (patches/README.md) paces the window by the display's CVDisplayLink
      # and keeps it drawing.
      - name: e2e scenario
        timeout-minutes: 10
        env:
          GPUI_LAB_IGNORE_OCCLUSION: "1"
          LATTICE_E2E_FRAMELESS_SHOT: ${{ runner.temp }}/e2e-macos-frameless.png
        run: |
          project="$RUNNER_TEMP/e2e-project"
          out="$RUNNER_TEMP/e2e-macos.json"
          cp -R fixtures/e2e "$project"
          # As on Windows: the builds, cleans and notices in the job's log.
          LATTICE_GPUI_LOG=info target/release/lattice-gpui "$project" --scenario e2e --out "$out"
          cat "$out"
          jq -e '.passed == true' "$out" > /dev/null
          file="$(jq -r '.after_quit.file' "$out")"
          grep -qF "$(jq -r '.after_quit.text' "$out")" "$file" || { echo "quitting did not save $file"; exit 1; }
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: gpui-e2e-macos
          path: |
            ${{ runner.temp }}/e2e-macos.json
            ${{ runner.temp }}/e2e-macos-frameless.png
          if-no-files-found: ignore
      # The parity report (gpui/README.md, "Parity harness"): the Main window
      # in light and dark, against the Tauri frontend on the mock-backend
      # page, region by region and pixel by pixel. A report for now, not a
      # gate: these steps never fail the job. The runner's screen shrinks the
      # window (about 1015 px wide), and the reference is drawn at whatever
      # size and scale the GPUI window got. Since it gates nothing, a release
      # tag skips it (about 5-15 minutes of pnpm install, Chromium and both
      # renders); the weekly run and a dispatch still write it.
      - name: Set up pnpm for the parity report
        if: ${{ !cancelled() && !startsWith(github.ref, 'refs/tags/') }}
        continue-on-error: true
        uses: ./.github/actions/setup-pnpm
      - name: Parity report
        if: ${{ !cancelled() && !startsWith(github.ref, 'refs/tags/') }}
        continue-on-error: true
        timeout-minutes: 15
        working-directory: .
        run: |
          pnpm exec playwright-core install chromium
          node --test gpui/parity/*.test.mjs
          node gpui/parity/run.mjs --out "$RUNNER_TEMP/parity" --app gpui/target/release/lattice-gpui
          sed '/^!\[/d' "$RUNNER_TEMP/parity/report.md" >> "$GITHUB_STEP_SUMMARY"
      - if: ${{ !cancelled() && !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: gpui-parity-macos
          path: |
            ${{ runner.temp }}/parity/*.md
            ${{ runner.temp }}/parity/*.json
            ${{ runner.temp }}/parity/*.png
            ${{ runner.temp }}/parity/runs/*.json
          if-no-files-found: ignore

  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
        working-directory: gpui
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gpui
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - run: script/fetch-pdfium.ps1
      - run: cargo build --release --locked
      # MiKTeX's latexmk is a Perl script; the runner's Strawberry Perl runs
      # it. Packages the documents need are installed on first use, without
      # the prompt a desktop install shows.
      #
      # Downloading and installing MiKTeX took several minutes a run and once
      # failed the job on the download's timeout, so the installed tree (its
      # common install, config and data, plus the per-user formats and
      # packages it fetches on first use) is cached. The key's version is
      # bumped by hand to pick up a newer MiKTeX; a restored tree that no
      # longer runs falls back to a fresh install.
      - name: Restore MiKTeX
        id: miktex-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            C:\Program Files\MiKTeX
            C:\ProgramData\MiKTeX
            ~\AppData\Local\MiKTeX
            ~\AppData\Roaming\MiKTeX
          key: miktex-${{ runner.os }}-v1
      - name: Install MiKTeX
        id: miktex
        timeout-minutes: 15
        run: |
          $bin = "C:\Program Files\MiKTeX\miktex\bin\x64"
          $restored = $false
          if (Test-Path "$bin\latexmk.exe") {
            & "$bin\latexmk.exe" --version
            $restored = $LASTEXITCODE -eq 0
          }
          if (-not $restored) {
            # choco retries nothing itself; the CTAN mirror it downloads from
            # stalls now and then.
            foreach ($attempt in 1..3) {
              choco install miktex --no-progress -y --execution-timeout=600
              if ($LASTEXITCODE -eq 0) { break }
              if ($attempt -eq 3) { throw "choco could not install MiKTeX" }
              Start-Sleep -Seconds 20
            }
            $bin = @("C:\Program Files\MiKTeX\miktex\bin\x64", "$env:LOCALAPPDATA\Programs\MiKTeX\miktex\bin\x64") |
              Where-Object { Test-Path "$_\initexmf.exe" } | Select-Object -First 1
            if (-not $bin) { throw "MiKTeX's binaries were not found after the install" }
            & "$bin\initexmf.exe" --admin --set-config-value=[MPM]AutoInstall=1
            & "$bin\miktex.exe" --admin packages update-package-database
            & "$bin\miktex.exe" --admin packages install latexmk
            & "$bin\latexmk.exe" --version
          }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "fresh=$(-not $restored)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - run: cargo test --release --locked --workspace -- --include-ignored
      # After the tests, so the packages and formats the documents fetched on
      # first use are in it. Saved only from main (a tag's cache is visible to
      # that tag alone) and only after a fresh install.
      - name: Save MiKTeX
        if: ${{ !cancelled() && steps.miktex.outputs.fresh == 'True' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v5
        with:
          path: |
            C:\Program Files\MiKTeX
            C:\ProgramData\MiKTeX
            ~\AppData\Local\MiKTeX
            ~\AppData\Roaming\MiKTeX
          key: ${{ steps.miktex-cache.outputs.cache-primary-key }}
      # The scenario posts window messages, so it needs no foreground window
      # or unlocked console; the runner's session gives GPUI a window, and
      # Direct3D falls back to WARP without a GPU.
      - name: e2e scenario
        timeout-minutes: 15
        run: |
          $project = Join-Path $env:RUNNER_TEMP "e2e-project"
          $out = Join-Path $env:RUNNER_TEMP "e2e-windows.json"
          Copy-Item -Recurse fixtures/e2e $project
          $env:LATTICE_GPUI_LOG = "info"
          $env:RUST_BACKTRACE = "1"
          $app = Start-Process -FilePath target/release/lattice-gpui.exe `
            -ArgumentList $project, "--scenario", "e2e", "--out", $out `
            -NoNewWindow -PassThru
          if (-not $app.WaitForExit(600000)) { $app.Kill(); throw "the e2e scenario did not finish in 10 minutes" }
          Get-Content $out
          $result = Get-Content $out -Raw | ConvertFrom-Json
          if (-not $result.passed) { throw "the e2e scenario failed" }
          # As on macOS: the text typed just before the scenario quit is saved.
          # The path is a verbatim one (\\?\D:\...), whose `?` Get-Content
          # would read as a wildcard, so .NET reads it.
          $quit = $result.after_quit
          if (-not [System.IO.File]::ReadAllText($quit.file).Contains($quit.text)) { throw "quitting did not save $($quit.file)" }
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: gpui-e2e-windows
          path: ${{ runner.temp }}/e2e-windows.json
          if-no-files-found: ignore

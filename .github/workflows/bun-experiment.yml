name: Bun experiment (temporary)

# Temporary: compares the whole Vitest suite under Node and under Bun 1.4 on
# identical runners. Removed before the pull request is ready.
on:
  push:
    branches: [fm/ci-speed]

jobs:
  vitest:
    name: vitest ${{ matrix.runtime }} (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [node, bun]
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/cache/restore@v5
        with:
          path: node_modules/.experimental-vitest-cache
          key: vitest-fs-${{ matrix.shard }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: vitest-fs-${{ matrix.shard }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: vitest under node
        if: matrix.runtime == 'node'
        run: pnpm vitest run --shard=${{ matrix.shard }}/3
      - name: vitest under bun
        if: matrix.runtime == 'bun'
        run: bun --bun ./node_modules/vitest/vitest.mjs run --shard=${{ matrix.shard }}/3

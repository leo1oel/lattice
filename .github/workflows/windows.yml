name: Windows
on:
  push:
    branches: [windows-port]
  workflow_dispatch:
    inputs:
      installer_run:
        description: Existing successful installer run to exercise without rebuilding
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: inputs.installer_run == ''
    runs-on: windows-latest
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      - name: Stage resources for compile checks
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/synara-runtime | Out-Null
          Set-Content src-tauri/synara-runtime/placeholder.txt 'Compilation check only'
      - name: Check the Windows host
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Test Windows file operations
        run: cargo test --manifest-path src-tauri/Cargo.toml --test windows_host
      - name: Build interface
        run: pnpm build
      - name: Prepare Windows resources
        run: pnpm prepare:windows
      - name: Test editable Word export with bundled Pandoc
        shell: pwsh
        run: |
          $env:LATTICE_TEST_PANDOC = (Resolve-Path src-tauri/synara-runtime/bin/pandoc.exe).Path
          cargo test --manifest-path src-tauri/Cargo.toml --test word_export
          if ($LASTEXITCODE -ne 0) { throw 'Word export integration tests failed' }
      - name: Build Windows installer
        run: pnpm tauri build --config src-tauri/tauri.windows.conf.json --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: Lattice-Windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

  e2e:
    needs: build
    if: ${{ !cancelled() && (needs.build.result == 'success' || inputs.installer_run != '') }}
    permissions:
      contents: read
      actions: read
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: Lattice-Windows-x64
          path: installer
          run-id: ${{ inputs.installer_run || github.run_id }}
          github-token: ${{ github.token }}
      - uses: r-lib/actions/setup-tinytex@v2
        env:
          TINYTEX_INSTALLER: TinyTeX-1
      - name: Install tutorial TeX packages
        shell: pwsh
        run: |
          tlmgr option repository https://mirror.ctan.org/systems/texlive/tlnet
          tlmgr update --self
          if ($LASTEXITCODE -ne 0) { throw 'TeX manager update failed' }
          tlmgr install collection-latexextra collection-fontsrecommended latexmk mylatexformat latexindent natbib lineno microtype booktabs environ
          if ($LASTEXITCODE -ne 0) { throw 'TeX package install failed' }
          if (!(kpsewhich environ.sty)) { throw 'The tutorial dependency environ.sty is still missing' }
      - name: Scan installer with Windows Defender when available
        shell: pwsh
        timeout-minutes: 5
        run: |
          if (!(Get-Command Get-MpComputerStatus -ErrorAction SilentlyContinue)) {
            Write-Output 'Windows Defender is not installed on this runner; no antivirus scan is claimed.'
            exit 0
          }
          $status = Get-MpComputerStatus -ErrorAction SilentlyContinue
          if (!$status -or !$status.AMServiceEnabled -or !$status.AntivirusEnabled) {
            Write-Output 'Windows Defender is unavailable on this runner; no antivirus scan is claimed.'
            exit 0
          }
          $scanner = Get-ChildItem "$env:ProgramData/Microsoft/Windows Defender/Platform/*/MpCmdRun.exe" -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (!$scanner) { throw 'Defender is enabled but its scanner could not be found' }
          $setup = (Get-ChildItem installer/*.exe | Select-Object -First 1).FullName
          & $scanner.FullName -Scan -ScanType 3 -File $setup -DisableRemediation
          if ($LASTEXITCODE -ne 0) { throw "Defender scan did not pass: $LASTEXITCODE" }
      - name: Install app and WebView2 driver
        shell: pwsh
        run: |
          $setup = (Get-ChildItem installer/*.exe | Select-Object -First 1).FullName
          $appDir = Join-Path $env:RUNNER_TEMP 'Lattice Windows é'
          $process = Start-Process -FilePath $setup -ArgumentList @('/S', "/D=$appDir") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          $app = (Get-ChildItem "$appDir/*.exe" | Where-Object { $_.Name -notmatch '(?i)uninstall' } | Select-Object -First 1).FullName
          if (!$app) { throw "Installed executable missing in $appDir" }
          "LATTICE_TEST_APP=$app" >> $env:GITHUB_ENV
          $webview = Get-ChildItem 'C:/Program Files (x86)/Microsoft/EdgeWebView/Application/*/msedgewebview2.exe' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (!$webview) { throw 'WebView2 runtime is missing after installation' }
          $edge = $webview.VersionInfo.ProductVersion
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$edge/edgedriver_win64.zip" -OutFile "$env:RUNNER_TEMP/edgedriver.zip"
          Expand-Archive "$env:RUNNER_TEMP/edgedriver.zip" "$env:RUNNER_TEMP/edgedriver"
      - name: Exercise the installed native app
        shell: powershell
        run: |
          & ./scripts/windows-native-e2e.ps1 -AppPath "$env:LATTICE_TEST_APP" -Artifacts "$env:RUNNER_TEMP/evidence"
      - name: Collect evidence and logs
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/evidence" | Out-Null
          Copy-Item "$env:RUNNER_TEMP/driver*.log" "$env:RUNNER_TEMP/evidence" -ErrorAction SilentlyContinue
          Copy-Item "$env:LOCALAPPDATA/app.lattice.windows/logs" "$env:RUNNER_TEMP/evidence/app-logs" -Recurse -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-test-evidence
          path: ${{ runner.temp }}/evidence
          retention-days: 30

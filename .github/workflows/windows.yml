name: Windows
on:
  push:
    branches: [windows-port]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Stage resources for compile checks
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/synara-runtime | Out-Null
          Set-Content src-tauri/synara-runtime/placeholder.txt 'Compilation check only'
      - name: Check the Windows host
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Build interface
        run: pnpm build
      - name: Prepare Windows resources
        run: node scripts/prepare-windows.mjs
      - name: Build Windows installer
        run: pnpm tauri build --config src-tauri/tauri.windows.conf.json --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: Lattice-Windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

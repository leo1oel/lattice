name: Release

# Push a version tag (e.g. v0.1.38) to build, sign, and publish a GitHub
# Release for Apple Silicon macOS. tauri-action also generates latest.json,
# which the in-app updater reads to offer updates to installed copies.
on:
  push:
    tags:
      - "v*"

# tauri-action needs write access to create the Release and upload assets.
permissions:
  contents: write

jobs:
  release:
    # macos-latest is Apple Silicon (arm64), which is all we target.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Release notes compare this tag with its nearest released ancestor.
          fetch-depth: 0

      - name: Prepare version-specific release notes
        id: release-notes
        shell: bash
        run: |
          set -euo pipefail

          notes_path="$RUNNER_TEMP/release-notes.md"
          previous_tag=""
          if previous_tag="$(
            git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null
          )"; then
            range="$previous_tag..$GITHUB_REF_NAME"
          else
            range="$GITHUB_REF_NAME"
          fi

          printf '## Changes in %s\n\n' "$GITHUB_REF_NAME" > "$notes_path"
          change_count=0
          while IFS=$'\t' read -r hash subject; do
            # The version-only commit adds no useful information for users.
            [[ "$subject" == "Release v"* ]] && continue
            printf -- '- %s (`%s`)\n' "$subject" "$hash" >> "$notes_path"
            ((change_count += 1))
          done < <(
            git log --reverse --no-merges --format=$'%h\t%s' "$range"
          )
          if ((change_count == 0)); then
            printf -- '- Maintenance release.\n' >> "$notes_path"
          fi

          cat >> "$notes_path" <<'EOF'

          ## Install (Apple Silicon Mac)

          Download the **.dmg** below, open it, and drag Lattice to Applications.

          Lattice is signed with an Apple Developer ID and notarized by Apple.

          Already running Lattice? It updates itself automatically — no need to
          re-download.
          EOF

          if [[ -n "$previous_tag" ]]; then
            printf '\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' \
              "$GITHUB_REPOSITORY" "$previous_tag" "$GITHUB_REF_NAME" \
              >> "$notes_path"
          fi

          delimiter="LATTICE_RELEASE_NOTES_${GITHUB_RUN_ID}"
          {
            printf 'body<<%s\n' "$delimiter"
            cat "$notes_path"
            printf '%s\n' "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Restores the warm dependency build from release-cache.yml. The key
          # has to match that workflow's exactly, so it comes from shared-key
          # rather than the job name — see the header there for why a tag can
          # only ever read the default branch's cache.
          shared-key: aarch64-apple-darwin-release
          # Anything saved here lands in this tag's scope, which no later
          # release can read. Skip the upload; release-cache.yml owns writing.
          save-if: false

      - run: pnpm install --frozen-lockfile

      - name: Prepare pinned Synara source
        run: |
          synara_repository="$(
            node -p "require('./scripts/synara-runtime.json').repository"
          )"
          synara_revision="$(
            node -p "require('./scripts/synara-runtime.json').revision"
          )"
          synara_source="$RUNNER_TEMP/lattice-synara"

          git init "$synara_source"
          git -C "$synara_source" remote add origin "$synara_repository"
          git -C "$synara_source" fetch --depth=1 origin "$synara_revision"
          git -C "$synara_source" checkout --detach FETCH_HEAD
          test "$(git -C "$synara_source" rev-parse HEAD)" = "$synara_revision"

          (
            cd "$synara_source"
            bun install --frozen-lockfile
          )
          echo "BUN_BIN=$(command -v bun)" >> "$GITHUB_ENV"
          echo "SYNARA_SOURCE_DIR=$synara_source" >> "$GITHUB_ENV"

      - name: Import Apple Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          certificate_path="$RUNNER_TEMP/apple-developer-certificate.p12"
          keychain_path="$RUNNER_TEMP/lattice-signing.keychain-db"

          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          signing_identity="$(
            security find-identity -v -p codesigning "$keychain_path" |
              awk -F '"' '/Developer ID Application/ { print $2; exit }'
          )"
          test -n "$signing_identity"
          echo "APPLE_SIGNING_IDENTITY=$signing_identity" >> "$GITHUB_ENV"

      - name: Prepare App Store Connect API key
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$api_key_path"
          chmod 600 "$api_key_path"
          echo "APPLE_API_KEY_PATH=$api_key_path" >> "$GITHUB_ENV"

      - name: Build, sign, and publish the release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=4096
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          # The updater signing key, stored as a repo secret (see setup guide).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Shared Firecrawl key for webpage imports, baked into the binary at
          # compile time (option_env! in firecrawl.rs). Extractable from the
          # shipped app — acceptable for small-scale use, rotate on abuse.
          LATTICE_FIRECRAWL_KEY: ${{ secrets.LATTICE_FIRECRAWL_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Lattice ${{ github.ref_name }}"
          # Generated from the actual commit range so direct commits are listed
          # too; GitHub's automatic notes only describe merged pull requests.
          releaseBody: ${{ steps.release-notes.outputs.body }}
          # Keep the release private until the signed artifacts pass Gatekeeper
          # and notarization-ticket verification below.
          releaseDraft: true
          prerelease: false
          # Generate and upload latest.json so the in-app updater can find updates.
          uploadUpdaterJson: true
          # Apple Silicon only. This makes the updater platform key darwin-aarch64.
          args: --target aarch64-apple-darwin

      - name: Notarize the distributable disk image
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          dmg_path="$(
            find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg \
              -maxdepth 1 -name '*.dmg' -print -quit
          )"

          test -n "$dmg_path"
          xcrun notarytool submit "$dmg_path" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$dmg_path"
          echo "DMG_PATH=$dmg_path" >> "$GITHUB_ENV"

      - name: Verify signed and notarized artifacts
        run: |
          codesign --verify --strict --verbose=2 "$DMG_PATH"
          spctl --assess \
            --type open \
            --context context:primary-signature \
            --verbose=4 \
            "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"

          mount_path="$(mktemp -d "$RUNNER_TEMP/lattice-dmg.XXXXXX")"
          hdiutil attach "$DMG_PATH" \
            -nobrowse \
            -readonly \
            -mountpoint "$mount_path"
          trap 'hdiutil detach "$mount_path"' EXIT

          app_path="$(find "$mount_path" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"

          # The outer --deep verification does not reliably diagnose a broken
          # nested framework after Tauri copies resources. Verify Chromium as
          # its own app and require it to carry the same release identity.
          chromium_app="$app_path/Contents/Resources/chromium-runtime/Lattice Chromium.app"
          test -d "$chromium_app"
          codesign --verify --deep --strict --verbose=2 "$chromium_app"
          outer_team="$(
            codesign -dv --verbose=4 "$app_path" 2>&1 |
              sed -n 's/^TeamIdentifier=//p'
          )"
          chromium_team="$(
            codesign -dv --verbose=4 "$chromium_app" 2>&1 |
              sed -n 's/^TeamIdentifier=//p'
          )"
          test -n "$outer_team"
          test "$chromium_team" = "$outer_team"

          spctl --assess --type execute --verbose=4 "$app_path"
          xcrun stapler validate "$app_path"

      - name: Upload the stapled disk image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" "$DMG_PATH" --clobber

      - name: Publish verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false

name: CI

on:
  push:
    branches: [main]
  pull_request:

# The frontend work is split so the wall clock is the slowest single job rather
# than the sum of every check. `pnpm test` dominates at ~160s, so it runs alone;
# lint and the production build together still finish well inside that, and the
# Rust job is shorter than either. Nothing is skipped — this only stops the
# checks from queueing behind each other.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # The collaboration server is its own pnpm project with its own lockfile and
  # is not part of the root install, so nothing above sees it. Its tests run on
  # `@cloudflare/vitest-pool-workers`, which starts a local workerd and
  # simulates the Durable Object and R2 bindings from `wrangler.jsonc` — no
  # Cloudflare account, API token, or `wrangler login` is involved. Only
  # `pnpm collab:deploy` needs credentials, and that is not run here.
  collab-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: collab-server/pnpm-lock.yaml
      - run: pnpm --dir collab-server install --frozen-lockfile
      - run: pnpm --dir collab-server typecheck
      - run: pnpm --dir collab-server test

  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      # Locally this is the `i18n-check` mise stage; it was the one stage of
      # `pnpm check` that CI never ran, so catalog drift passed here and only
      # failed on a contributor's machine.
      #
      # `pnpm i18n:check` re-extracts the catalogs and then asserts `git diff
      # --exit-code -- src/locales`, so it is only meaningful on a clean
      # checkout — which is exactly what actions/checkout gives us, and why this
      # step must come after `pnpm build` rather than before: extraction and
      # `lingui compile` rewrite files under `src/locales/`, and nothing may run
      # against that rewritten tree.
      - name: Check the i18n catalogs are in sync
        run: pnpm i18n:check

      # Same reasoning: `pnpm check` gained a `notices` stage that CI did not
      # run, so a dependency added without regenerating THIRD_PARTY_NOTICES.md
      # would only fail locally. Reads the installed trees plus `cargo
      # metadata`; it does not build. The Synara sidecar is absent here, so its
      # section is carried over rather than regenerated — the npm and crates
      # closures are what this gate protects.
      - name: Check the third-party notices are in sync
        run: pnpm notices:check

  rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Writing the cache costs ~25s on every run. Only the main branch can
          # produce a cache that later runs reuse, so pull requests read it and
          # skip the upload.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Cargo compiles Tauri's resource manifest, but these tests never launch
      # the bundled service. The release workflow prepares the real pinned
      # runtime before packaging.
      - name: Stub the Synara runtime resource for compilation
        run: |
          mkdir -p src-tauri/synara-runtime
          echo stub > src-tauri/synara-runtime/placeholder.txt
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

name: CI

on:
  push:
    branches: [main]
  pull_request:

# The frontend work is split so the wall clock is the slowest single job rather
# than the sum of every check. Vitest deliberately uses one worker per process
# to keep the memory-heavy app/editor suites stable, so CI shards the test files
# across three isolated runners. Sharding skips nothing — it only stops the
# checks from queueing behind each other.
jobs:
  # Pull requests that touch only documentation cannot change what any job
  # below checks, so those jobs skip instead of spending ~10 minutes proving
  # it. They are skipped job by job rather than with a workflow-level `paths:`
  # filter so every check still reports under its own name — a required check
  # that never reports blocks the merge, while a skipped one satisfies it.
  #
  # The list is deliberately short: anything not named below is code. Some
  # Markdown is not documentation — THIRD_PARTY_NOTICES.md is verified by
  # `pnpm notices:check`, the skills under src-tauri/ are embedded and tested,
  # and public/licenses/ ships in the app — so only top-level and .github/
  # Markdown counts, never nested Markdown. Pushes to main always run
  # everything, and so does a failure here: the jobs skip only on an explicit
  # `false`.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      # A pull_request run checks out the PR merged into its base, so the merge
      # commit's first parent is the base and the diff between them is exactly
      # what the PR changes.
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: classify
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # --no-renames lists a rename as its deletion plus its addition, so
          # moving code into docs/ still counts as touching code.
          changed=$(git -c core.quotePath=false diff --no-renames --name-only HEAD^1 HEAD)
          code=false
          [ -n "$changed" ] || code=true
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            case "$path" in
              THIRD_PARTY_NOTICES.md) ;;
              docs/* | .github/ISSUE_TEMPLATE/*) continue ;;
              .github/*/*) ;;
              .github/*.md) continue ;;
              */*) ;;
              *.md | LICENSE | NOTICE) continue ;;
            esac
            echo "code: $path"
            code=true
          done <<< "$changed"
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  test:
    name: test (${{ matrix.shard }}/3)
    needs: changes
    # Skipping a matrix job skips it before the matrix expands, so it would
    # report one unexpanded `test (${{ matrix.shard }}/3)` check instead of the
    # three shards. The shards therefore always start and skip their steps.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      CODE: ${{ needs.changes.outputs.code != 'false' }}
    steps:
      - if: env.CODE == 'false'
        run: echo "Documentation-only change; nothing to test."
      - if: env.CODE == 'true'
        uses: actions/checkout@v7
      - if: env.CODE == 'true'
        uses: ./.github/actions/setup-pnpm
      # vitest.config.ts turns on Vitest's fs module cache. A checkout starts
      # with it empty, so each shard restores the transforms its files last
      # produced on main. Entries are keyed by content, so a stale one is never
      # used, only left unread; the lockfile in the key drops the lot whenever
      # dependencies move, which is also when Vitest would discard it.
      - if: env.CODE == 'true'
        uses: actions/cache/restore@v5
        with:
          path: node_modules/.experimental-vitest-cache
          key: vitest-fs-${{ matrix.shard }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: vitest-fs-${{ matrix.shard }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - if: env.CODE == 'true'
        run: pnpm vitest run --shard=${{ matrix.shard }}/3
      # Like the Rust cache below: only main writes, pull requests read.
      - if: env.CODE == 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v5
        with:
          path: node_modules/.experimental-vitest-cache
          key: vitest-fs-${{ matrix.shard }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}

  # The literature Worker is its own pnpm project with its own lockfile and is
  # not part of the root install, so nothing above sees it. Its tests run on
  # `@cloudflare/vitest-pool-workers`, which starts a local workerd and
  # simulates the Durable Object and rate-limit bindings from `wrangler.jsonc` —
  # no Cloudflare account, API token, or `wrangler login` is involved. Only a
  # deploy needs credentials, and that is not run here.
  literature-worker:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
        with:
          project: literature-worker
      - run: pnpm --dir literature-worker typecheck
      - run: pnpm --dir literature-worker test

  # The Open Slide presentation server (tools/open-slide-runtime) is its own
  # pnpm project, staged into the app by prepare-presentation-runtime.mjs.
  # Locally this is the `open-slide-runtime` mise stage.
  open-slide-runtime:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
        with:
          project: tools/open-slide-runtime
      - run: pnpm --dir tools/open-slide-runtime test

  lint-and-build:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm lint
      - run: pnpm knip
      # Locally part of the `lint` mise stage: every table in
      # docs/performance.md is accounted for in
      # docs/performance-data/manifest.json, and each benchmark table is
      # recomputed from the raw runs it names.
      - run: pnpm perf:evidence
      - run: pnpm build
      # Locally this is the `i18n-check` mise stage; it was the one stage of
      # `pnpm check` that CI never ran, so catalog drift passed here and only
      # failed on a contributor's machine.
      #
      # `pnpm i18n:check` re-extracts the catalogs and then asserts `git diff
      # --exit-code -- src/locales`, so it is only meaningful on a clean
      # checkout — which is exactly what actions/checkout gives us, and why this
      # step must come after `pnpm build` rather than before: extraction and
      # `lingui compile` rewrite files under `src/locales/`, and nothing may run
      # against that rewritten tree.
      - name: Check the i18n catalogs are in sync
        run: pnpm i18n:check

      # Same reasoning: `pnpm check` gained a `notices` stage that CI did not
      # run, so a dependency added without regenerating THIRD_PARTY_NOTICES.md
      # would only fail locally. Reads the installed trees plus `cargo
      # metadata`; it does not build. The Synara sidecar is absent here, so its
      # section is carried over rather than regenerated — the npm and crates
      # closures are what this gate protects.
      - name: Check the third-party notices are in sync
        run: pnpm notices:check

  # Deterministic interaction benchmark (docs/performance.md, "Interaction
  # benchmark and CI gate"). It builds the app's bench page, drives typing, file
  # switching, PDF and scrolling scenarios in the runner's preinstalled Google
  # Chrome, and fails when a gated per-interaction count exceeds its ceiling in
  # scripts/perf-bench/budgets.json. Which counts are gated and which are
  # report-only (frame-timing-dependent) is documented there. No Tauri host is
  # involved; the page answers the app's IPC from an in-memory fixture project.
  # `--layout` then checks geometry jsdom cannot (scripts/perf-bench/layout-checks.mjs).
  perf-bench:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm perf:bench --check
      - run: pnpm perf:bench --layout

  # The same scenarios in WebKit, the engine release builds render in, against
  # scripts/perf-bench/budgets-webkit.json. WebKit pays several times
  # Chromium's cost for every element it styles and lays out, so a change that
  # puts far more of the document in the DOM (or writes to it far more often)
  # costs WebKit users first. Playwright's macOS WebKit build is the closest
  # one to the system WKWebView a runner can drive headless.
  perf-bench-webkit:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm exec playwright-core install webkit
      - run: pnpm perf:bench --check --engine webkit
      - run: pnpm perf:bench --layout --engine webkit

  rust:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Writing the cache costs ~25s on every run. Only the main branch can
          # produce a cache that later runs reuse, so pull requests read it and
          # skip the upload.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Cargo compiles Tauri's resource manifest, but these tests never launch
      # the bundled Synara runtime. The release workflow prepares the real
      # pinned resources before packaging.
      - name: Stub bundled runtime resources for compilation
        run: |
          mkdir -p src-tauri/synara-runtime
          echo stub > src-tauri/synara-runtime/placeholder.txt
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

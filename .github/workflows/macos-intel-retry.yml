name: macOS Intel retry

# Re-runs a release's macOS Intel run once when its first attempt fails, so
# Intel Macs get the release without anyone re-running it by hand.
#
# GitHub has failed a run whose build passed, with "Internal server error" in
# place of creating smoke and attach (v0.16.4's first attempt): no job failed,
# so `gh run rerun --failed` refuses it ("cannot be retried") and only a full
# re-run attaches the Intel assets. An attempt with a failed job re-runs just
# those jobs and the ones after them, reusing the build's outputs and
# artifact. attach's own guard still holds: a full re-run rebuilds the
# archive, and attach refuses to replace an Intel archive latest.json already
# vouches for, so an attempt whose attach succeeded is left alone.
#
# Only release runs (macOS Intel starts from workflow_run for those alone; a
# pull request's or a hand run's author re-runs their own), and only the
# first attempt: a second failure is real and is left red. A re-run keeps the
# original event, so it attaches to the same release. This is the third
# workflow_run level (Release, macOS Intel, this), the deepest GitHub starts.
on:
  workflow_run:
    workflows: [macOS Intel]
    types: [completed]

permissions:
  actions: write

jobs:
  rerun:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'workflow_run' &&
      github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - name: Re-run the first attempt once
        run: |
          set -euo pipefail
          jobs="$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/attempts/1/jobs" --jq '[.jobs[] | {name, conclusion}]')"
          echo "Attempt 1: $jobs"
          if jq -e 'any(.name == "attach" and .conclusion == "success")' <<<"$jobs" >/dev/null; then
            echo "attach succeeded: the release has its Intel assets, and a full re-run's new archive would be refused."
          elif jq -e 'any(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out")' <<<"$jobs" >/dev/null; then
            gh run rerun "$RUN_ID" --failed
          else
            gh run rerun "$RUN_ID"
          fi

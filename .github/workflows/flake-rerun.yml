name: Flake rerun

# When CI fails on main, re-run its failed jobs once. A pass means the first
# failure was a flake: scripts/known-flakes.mjs comments what failed on the
# "Known flakes" issue (label `known-flakes`), so main goes green on its own and
# the next worker who meets that check can look it up instead of re-deriving
# "it fails on main too". A second failure is real and is left red; this job
# fails with it. GitHub keeps both attempts on the run page, so a rerun never
# hides the first failure.
#
# Only main: a pull request's author reruns their own checks, and a red pull
# request is the signal they need. Only the first attempt: the re-run's own
# completion must not re-run it again.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  rerun:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    # Covers a re-run that waits for macOS runners behind other lanes.
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/known-flakes.mjs
          sparse-checkout-cone-mode: false
      - name: Re-run the failed jobs once
        run: gh run rerun "$RUN_ID" --failed --repo "$REPO"
      # `gh run watch` could read the finished first attempt before the re-run
      # registers, so wait for attempt 2 by number.
      - name: Wait for the re-run
        id: rerun
        run: |
          while :; do
            sleep 30
            read -r attempt status conclusion < <(gh api "repos/$REPO/actions/runs/$RUN_ID" \
              --jq '"\(.run_attempt) \(.status) \(.conclusion // "-")"')
            [ "$attempt" -ge 2 ] && [ "$status" = completed ] && break
          done
          echo "attempt 2: $conclusion"
          echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"
      - name: Record the flake
        if: steps.rerun.outputs.conclusion == 'success'
        run: node scripts/known-flakes.mjs --run "$RUN_ID" --attempt 1 --kind rerun
      - name: Leave a real failure red
        if: steps.rerun.outputs.conclusion != 'success'
        env:
          CONCLUSION: ${{ steps.rerun.outputs.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          echo "Failed twice ($CONCLUSION on the re-run): a real failure, not recorded as a flake. $RUN_URL" | tee -a "$GITHUB_STEP_SUMMARY"
          exit 1

# Dependabot configuration for Lattice.
#
# There is no pnpm workspace here: the repository holds three independent npm
# projects, each with its own `pnpm-lock.yaml` — `/` (the desktop app),
# `/collab-server` (the Cloudflare Worker), and `/video` (the Remotion promo
# project) — plus one Cargo project at `/src-tauri`.
#
# ─────────────────────────────────────────────────────────────────────────────
#  ⚠️  READ BEFORE MERGING ANY npm BUMP AT `/`
# ─────────────────────────────────────────────────────────────────────────────
#
# The root `package.json` carries pnpm `patchedDependencies` and `overrides`,
# and Dependabot understands neither. It bumps a version in `package.json` and
# regenerates the lockfile; it does NOT update the patch key, the patch file, or
# the override pins. The result usually fails at install time — and when it does
# not, it silently drops a local fix.
#
#   pnpm.patchedDependencies (patch files live in `patches/`):
#     • "@tiptap/react@3.23.5"        → patches/@tiptap__react@3.23.5.patch
#     • "@pierre/trees@1.0.0-beta.6"  → patches/@pierre__trees@1.0.0-beta.6.patch
#
#   The patch key pins an EXACT version. Bumping `@tiptap/react` to 3.24.0
#   without renaming the key and refreshing the patch makes `pnpm install`
#   fail with an unmatched patch. Same for `@pierre/trees`.
#
#   pnpm.overrides (all pinned to the same tiptap version, today 3.23.5):
#     @tiptap/extension-bubble-menu, -bullet-list, -collaboration, -dropcursor,
#     -floating-menu, -gapcursor, -list-item, -list-keymap, -node-range,
#     -ordered-list, and @tiptap/extensions.
#
#   Those overrides exist so every transitive tiptap package resolves to one
#   copy — two ProseMirror schemas in one bundle is a class of bug that only
#   shows up at runtime. A bump that moves the direct dependencies but leaves
#   the overrides behind reintroduces exactly that.
#
# So: the `tiptap` group below exists to keep every tiptap package in one pull
# request. Do not merge it as-is. Treat it as a notification, then do the bump
# by hand:
#
#   1. move every `@tiptap/*` dependency AND every `pnpm.overrides` entry to the
#      new version together;
#   2. rename the `@tiptap/react@<old>` key in `pnpm.patchedDependencies` and
#      regenerate the patch (`pnpm patch @tiptap/react@<new>` → edit →
#      `pnpm patch-commit`);
#   3. `pnpm install` and run `pnpm check`.
#
# Several other dependencies are deliberately pinned to an exact version (no
# caret) for the same "one copy only" reason — `@shikijs/langs`/`@shikijs/themes`
# must match `shiki`, `@univerjs/*` must match each other, and `pdfjs-dist`,
# `tldraw`, `rxjs`, `exceljs`, and the `mdast-util-mdx*` set are pinned on
# purpose. They are grouped below so a mismatch cannot arrive one pull request
# at a time.
#
# Bundle size is a hard gate: `pnpm build` fails if the eager startup chunks
# exceed the budget in `scripts/app-size-report.mjs`. A dependency bump can
# break that build without changing a line of our code.
#
# Note on labels: Dependabot creates `dependencies` itself, but every other
# label used below (`collab-server`, `video`, `rust`, `ci`) must already exist
# in the repository — create them once under Issues → Labels, or Dependabot
# quietly drops them.

version: 2

updates:
  # ── Desktop app (root) ─────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: deps
      prefix-development: deps-dev
    groups:
      # Patched and override-pinned. See the warning at the top of this file:
      # never merge this group without also moving pnpm.overrides and the
      # @tiptap/react patch key.
      tiptap:
        patterns:
          - "@tiptap/*"
      # Pinned to exact versions that must match each other.
      shiki:
        patterns:
          - shiki
          - "@shikijs/*"
      univer:
        patterns:
          - "@univerjs/*"
      # Version-locked families that release in lockstep.
      codemirror:
        patterns:
          - "@codemirror/*"
          - "@lezer/*"
          - "@replit/codemirror-*"
          - codemirror-lang-*
          - y-codemirror.next
      lingui:
        patterns:
          - "@lingui/*"
          - eslint-plugin-lingui
      tauri:
        patterns:
          - "@tauri-apps/*"
      # Yjs and the collaboration transport are shared with /collab-server and
      # with protocol/ — a bump here has to be matched there.
      yjs:
        patterns:
          - yjs
          - y-protocols
          - y-partyserver
          - lib0
      unified:
        patterns:
          - unified
          - remark-*
          - rehype-*
          - mdast-util-*
          - micromark-*
          - unist-util-*
          - vfile
      # Low-risk build and type-only churn, batched so it is one review.
      dev-tooling:
        dependency-type: development
        patterns:
          - "@types/*"
          - eslint
          - "@eslint/*"
          - typescript-eslint
          - eslint-plugin-*
          - vitest
          - "@vitest/*"
          - "@testing-library/*"
          - jsdom
          - knip

  # ── Collaboration server (Cloudflare Worker) ───────────────────────────────
  # Its own pnpm-lock.yaml. `wrangler` and `@cloudflare/vitest-pool-workers`
  # move together with the workerd runtime; a mismatch breaks `pnpm --dir
  # collab-server test` before it breaks a deploy.
  - package-ecosystem: npm
    directory: "/collab-server"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - collab-server
    commit-message:
      prefix: deps
      prefix-development: deps-dev
    groups:
      cloudflare:
        patterns:
          - wrangler
          - "@cloudflare/*"
      # Must stay compatible with the same packages at the repository root:
      # both sides speak the same Yjs update format over the wire.
      yjs:
        patterns:
          - yjs
          - y-protocols
          - y-partyserver
          - partyserver
          - lib0

  # ── Remotion promo video project ───────────────────────────────────────────
  # Not shipped in the app and not covered by CI. Low priority; grouped hard so
  # it never dominates the pull request queue.
  - package-ecosystem: npm
    directory: "/video"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - video
    commit-message:
      prefix: deps
      prefix-development: deps-dev
    groups:
      # Every @remotion/* package must be on exactly one version.
      remotion:
        patterns:
          - remotion
          - "@remotion/*"
      video-rest:
        patterns:
          - "*"
        exclude-patterns:
          - remotion
          - "@remotion/*"

  # ── Rust / Tauri backend ───────────────────────────────────────────────────
  # `src-tauri/Cargo.toml` has a size-tuned [profile.release]; a bump that grows
  # the binary or trips Clippy shows up in CI, not here.
  - package-ecosystem: cargo
    directory: "/src-tauri"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - rust
    commit-message:
      prefix: deps
    groups:
      tauri:
        patterns:
          - tauri
          - tauri-*
      # Everything else in one patch-level pull request; minor and major bumps
      # still arrive individually.
      cargo-patch:
        patterns:
          - "*"
        update-types:
          - patch

  # ── GitHub Actions used by the workflows ───────────────────────────────────
  # The release workflow signs and notarizes, so a compromised or unexpectedly
  # changed action here has real reach. Review these individually.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: ci

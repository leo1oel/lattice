[package]
name = "lattice-core"
# Kept equal to the app's version (scripts/bump-version.mjs rewrites both):
# the core reports `CARGO_PKG_VERSION` as Lattice's own, in the TeX Live
# user agent, the terminal's TERM_PROGRAM_VERSION, TexLab's clientInfo and
# research-env episodes.
version = "0.16.17"
description = "Lattice's domain logic: projects, LaTeX builds, Overleaf sync, papers and the agent sidecar, shared by every shell"
authors = ["Leonardo"]
edition = "2021"
license = "Apache-2.0"
publish = false

[features]
# The real-app measurement lab's TexLab probe (texlab.rs); the shell's own
# `perf-lab` feature turns it on.
perf-lab = []
# `test_support`'s fixtures for a shell's own unit tests (its dev-dependency
# turns this on); the core's tests always have them.
test-support = []

[build-dependencies]
cc = "1"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
chrono = "0.4"
regex = "1"
# `system-proxy` is one of reqwest's defaults, so `default-features = false`
# silently dropped it: every request here ignored the macOS proxy settings AND
# HTTPS_PROXY/ALL_PROXY, because reqwest reads both only under that feature.
# The Overleaf login window is a WKWebView and honours the system proxy, so a
# user behind one signed in fine and then watched Lattice's own call to the
# same host fail with "error sending request". Loopback callers that must not
# be proxied (the Synara health check) say `.no_proxy()` themselves.
# 0.13 is the version tauri-plugin-updater compiles in, so there is one HTTP/TLS
# stack. `rustls-no-provider` reuses the updater's `ring` provider instead of
# compiling aws-lc-rs as a second one; http::install_tls_provider installs it
# before any client is built, because without one reqwest panics. Server
# certificates are checked against the macOS trust store (rustls-platform-
# verifier), as the updater and the Overleaf login WKWebView already do.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "query", "rustls-no-provider", "multipart", "stream", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
walkdir = "2"
log = "0.4"
# Operation spans that become one wide log event each (src/wide_event.rs).
# Output still goes through `log`, to whatever logger the shell installed; no
# formatter is needed.
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
flate2 = "1"
# Reads a drawing's XML the way the drawing program's own parser will
# (project/figure_converters/svg_links.rs). The version tauri's own
# dependencies already compile in; no extra copy.
quick-xml = "0.41"
tar = "0.4"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
# 0.10 matches the version tauri and its plugins already compile in; 0.11
# shipped a second copy of the whole digest stack for one Sha256::digest call.
sha2 = "0.10"
# The hash Overleaf checks an update against (`doc_push`); already compiled in
# for the websocket handshake.
sha1 = "0.10"
md5 = "0.7"
diffy = "0.5.1"
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots", "handshake"] }
futures-util = { version = "0.3.33", default-features = false, features = ["std", "sink"] }
# `rt-multi-thread` for the runtime `runtime` falls back to when no shell
# installed its own (unit tests); tauri already compiles it in.
tokio = { version = "1", features = ["sync", "net", "time", "rt", "rt-multi-thread"] }
axum = { version = "0.8", features = ["ws"] }
# The URL type tauri re-exports, for TexLab's file URIs.
url = "2"
# The macOS Keychain, and on Linux the Secret Service (GNOME Keyring, KWallet)
# over D-Bus, so saved keys survive a reboot: `linux-native` alone is the
# kernel keyutils store, which keeps them in memory only. The sync client
# avoids picking an async runtime; crypto-rust avoids linking OpenSSL.
keyring = { version = "3", features = ["apple-native", "sync-secret-service", "crypto-rust"] }

# 0.2.4 aborts the whole conversion when even one page is classified as
# needing OCR (including arXiv 2605.30170); keep the tested 0.1 line until the
# new API can preserve the remaining text-layer pages.
anydoc = "0.1.9"
# Already in the tree through anydoc; direct for the review PDF's annotations
# (review_pdf.rs), written as an incremental update after the built bytes.
lopdf = "0.42"
# Already in the tree transitively; direct so paper.md normalization can slug
# headings with the exact NFKD semantics of the editor's toWikiLinkSlug.
unicode-normalization = "0.1"
harper-core = { version = "2.7.0", default-features = false, features = ["concurrent"] }
# Full-text search over the paper library (papers/search_index.rs). Without
# the defaults: no zstd column compression or stop-word lists, which the
# index does not use.
tantivy = { version = "0.27", default-features = false, features = ["mmap", "lz4-compression", "stemmer"] }
# Chinese word segmentation for that index; its dictionary is compiled in,
# zstd-compressed, and loaded on the first Han text the index sees.
jieba-rs = "0.11"
notify = "8"
scraper = "0.27"
spellbook = "0.4.2"

[target.'cfg(target_os = "macos")'.dependencies]
# Provider CLIs are ordinary child processes and do not use CFNetwork, so a
# Finder-launched app has to translate macOS's system proxy into their env.
system-configuration = "0.7"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus", "Win32_System_JobObjects", "Win32_Security"] }
keyring = { version = "3", features = ["windows-native"] }
cap-std = "3"
portable-pty = "0.9"

[dev-dependencies]
tiny_http = "0.12.0"

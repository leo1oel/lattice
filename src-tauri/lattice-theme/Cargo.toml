[package]
name = "lattice-theme"
version = "0.1.0"
description = "Lattice themes: the lattice-theme.json format, its validation, and the resolver and colour fitting both shells apply a theme with"
authors = ["Leonardo"]
edition = "2021"
license = "Apache-2.0"
publish = false

# Only serde: the GPUI app's lattice-ui (GPL-3.0) depends on this crate as
# well as lattice-core, so it stays small and licence-neutral (Apache-2.0).
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

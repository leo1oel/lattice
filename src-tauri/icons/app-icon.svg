<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    Apple's macOS app icon grid (macOS 11+ template): an 824x824 body centred on
    the 1024 canvas (100 px margin), continuous corners of radius 185.4, and the
    system drop shadow (black 30%, 12 px down, 12 px blur) inside the margin.
    A body drawn larger than this grid reads one size bigger than its Dock
    neighbours. The lattice is the original 940 px drawing scaled by 824/940.
  -->
  <defs>
    <path id="body" d="M396.64 100 h230.72 c103.834 0 155.751 0 195.41 20.207 a185.4 185.4 0 0 1 81.023 81.023 c20.207 39.659 20.207 91.576 20.207 195.41 v230.72 c0 103.834 0 155.751 -20.207 195.41 a185.4 185.4 0 0 1 -81.023 81.023 c-39.659 20.207 -91.576 20.207 -195.41 20.207 h-230.72 c-103.834 0 -155.751 0 -195.41 -20.207 a185.4 185.4 0 0 1 -81.023 -81.023 c-20.207 -39.659 -20.207 -91.576 -20.207 -195.41 v-230.72 c0 -103.834 0 -155.751 20.207 -195.41 a185.4 185.4 0 0 1 81.023 -81.023 c39.659 -20.207 91.576 -20.207 195.41 -20.207 Z"/>
    <clipPath id="body-clip">
      <use href="#body"/>
    </clipPath>
    <filter id="shadow" x="0" y="0" width="1024" height="1024" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dy="12" result="blur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="weft" x1="224" y1="512" x2="800" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4E5C1D"/>
      <stop offset="1" stop-color="#6A7A2B"/>
    </linearGradient>
    <linearGradient id="warp" x1="512" y1="224" x2="512" y2="800" gradientUnits="userSpaceOnUse">
      <stop stop-color="#AEB763"/>
      <stop offset="1" stop-color="#909E42"/>
    </linearGradient>
  </defs>
  <use href="#body" fill="#F7F2E8" filter="url(#shadow)"/>
  <!-- Hairline edge: a centred stroke clipped to the body leaves 1.75 px inside, the old 2 px scaled. -->
  <use href="#body" stroke="#23211E" stroke-opacity="0.1" stroke-width="3.5" clip-path="url(#body-clip)"/>
  <g transform="translate(512 512) scale(0.876596) translate(-512 -512)">
    <g transform="rotate(45 512 512)">
      <g fill="none" stroke="url(#weft)" stroke-width="68" stroke-linecap="round">
        <path d="M250 336H774"/>
        <path d="M250 512H774"/>
        <path d="M250 688H774"/>
      </g>
      <g fill="none" stroke="url(#warp)" stroke-width="68" stroke-linecap="butt">
        <path d="M336 250V478"/>
        <path d="M336 546V774"/>
        <path d="M512 250V302"/>
        <path d="M512 370V654"/>
        <path d="M512 722V774"/>
        <path d="M688 250V478"/>
        <path d="M688 546V774"/>
      </g>
      <g fill="url(#warp)">
        <circle cx="336" cy="250" r="34"/>
        <circle cx="336" cy="774" r="34"/>
        <circle cx="512" cy="250" r="34"/>
        <circle cx="512" cy="774" r="34"/>
        <circle cx="688" cy="250" r="34"/>
        <circle cx="688" cy="774" r="34"/>
      </g>
    </g>
  </g>
</svg>

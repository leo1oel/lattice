[package]
name = "research-writer"
version = "0.1.186"
description = "A local-first, agent-first scientific LaTeX writing environment"
authors = ["Leonardo"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "research_writer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Halves the release binary (measured 26.6 MB -> 12.9 MB on aarch64-darwin).
# panic="abort" would save ~3 MB more but turns any panic into a hard crash
# with unsaved editor state on screen, so it stays off.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = "symbols"

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "multipart", "stream"] }
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
walkdir = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-window-state = "2"
tauri-plugin-log = "2"
log = "0.4"
rusqlite = { version = "0.40.1", features = ["bundled"] }
flate2 = "1"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
# 0.10 matches the version tauri and its plugins already compile in; 0.11
# shipped a second copy of the whole digest stack for one Sha256::digest call.
sha2 = "0.10"
md5 = "0.7"
html-escape = "0.2.14"
diffy = "0.5.1"
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots", "handshake"] }
futures-util = { version = "0.3.33", default-features = false, features = ["std", "sink"] }
tokio = { version = "1", features = ["sync", "net", "time"] }
keyring = { version = "3", features = ["apple-native"] }
rustix = { version = "1", features = ["fs"] }
anydoc = "0.1.7"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSGeometry",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "objc2-core-foundation",
  "NSButton",
  "NSColor",
  "NSColorSampler",
  "NSColorSpace",
  "NSControl",
  "NSEvent",
  "NSResponder",
  "NSView",
  "NSWindow",
] }
objc2-web-kit = { version = "0.3", default-features = false, features = [
  "std",
  "objc2-app-kit",
  "WKWebView",
] }
block2 = "0.6"

[dev-dependencies]
tiny_http = "0.12.0"

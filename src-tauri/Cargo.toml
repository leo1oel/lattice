[package]
name = "research-writer"
version = "0.12.1"
description = "A local-first, agent-first scientific LaTeX writing environment"
authors = ["Leonardo"]
edition = "2021"
# The tldraw SDK in the frontend is under its own license; see ../NOTICE.
license = "Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "research_writer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# The real-app measurement lab (src/perf_lab.rs and the frontend harness it
# drives). Only scripts/perf-lab.mjs turns it on; release builds never do.
perf-lab = []

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

# Halves the release binary (measured 26.6 MB -> 12.9 MB on aarch64-darwin).
# panic="abort" would save ~3 MB more but turns any panic into a hard crash
# with unsaved editor state on screen, so it stays off.
# Tuned for release *time* as well as size. Fat LTO with a single codegen unit
# is the slowest configuration cargo has — it was taking ~20 of the release
# workflow's ~27 minutes — and thin LTO across 16 units recovers most of its
# size win for a fraction of the compile. `opt-level = "s"` and symbol
# stripping, which do the bulk of the size work, are unchanged.
[profile.release]
codegen-units = 16
lto = false
opt-level = "s"
strip = "symbols"

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
chrono = "0.4"
regex = "1"
# `system-proxy` is one of reqwest's defaults, so `default-features = false`
# silently dropped it: every request here ignored the macOS proxy settings AND
# HTTPS_PROXY/ALL_PROXY, because reqwest reads both only under that feature.
# The Overleaf login window is a WKWebView and honours the system proxy, so a
# user behind one signed in fine and then watched Lattice's own call to the
# same host fail with "error sending request". Loopback callers that must not
# be proxied (the Synara health check) say `.no_proxy()` themselves.
# 0.13 is the version tauri-plugin-updater compiles in, so there is one HTTP/TLS
# stack. `rustls-no-provider` reuses the updater's `ring` provider instead of
# compiling aws-lc-rs as a second one; http::install_tls_provider installs it
# before any client is built, because without one reqwest panics. Server
# certificates are checked against the macOS trust store (rustls-platform-
# verifier), as the updater and the Overleaf login WKWebView already do.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "query", "rustls-no-provider", "multipart", "stream", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
walkdir = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-window-state = "2"
tauri-plugin-log = "2"
rfd = "0.16"
log = "0.4"
# Operation spans that become one wide log event each (src/wide_event.rs).
# Output still goes through `log` and tauri-plugin-log; no formatter is needed.
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
flate2 = "1"
tar = "0.4"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
# 0.10 matches the version tauri and its plugins already compile in; 0.11
# shipped a second copy of the whole digest stack for one Sha256::digest call.
sha2 = "0.10"
md5 = "0.7"
diffy = "0.5.1"
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots", "handshake"] }
futures-util = { version = "0.3.33", default-features = false, features = ["std", "sink"] }
tokio = { version = "1", features = ["sync", "net", "time"] }
axum = { version = "0.8", features = ["ws"] }
keyring = { version = "3", features = ["apple-native"] }
rustix = { version = "1", features = ["fs"] }
# 0.2.4 aborts the whole conversion when even one page is classified as
# needing OCR (including arXiv 2605.30170); keep the tested 0.1 line until the
# new API can preserve the remaining text-layer pages.
anydoc = "0.1.9"
# Already in the tree through anydoc; direct for the review PDF's annotations
# (review_pdf.rs), written as an incremental update after the built bytes.
lopdf = "0.42"
# Already in the tree transitively; direct so paper.md normalization can slug
# headings with the exact NFKD semantics of the editor's toWikiLinkSlug.
unicode-normalization = "0.1"
harper-core = { version = "2.7.0", default-features = false, features = ["concurrent"] }
# Full-text search over the paper library (papers/search_index.rs). Without
# the defaults: no zstd column compression or stop-word lists, which the
# index does not use.
tantivy = { version = "0.27", default-features = false, features = ["mmap", "lz4-compression", "stemmer"] }
# Chinese word segmentation for that index; its dictionary is compiled in,
# zstd-compressed, and loaded on the first Han text the index sees.
jieba-rs = "0.11"
notify = "8"
scraper = "0.27"

[target.'cfg(target_os = "macos")'.dependencies]
# Provider CLIs are ordinary child processes and do not use CFNetwork, so a
# Finder-launched app has to translate macOS's system proxy into their env.
system-configuration = "0.7"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSArray",
  "NSGeometry",
  "NSString",
  "NSURL",
  "NSUserDefaults",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "objc2-core-foundation",
  "NSAccessibility",
  "NSAppearance",
  "NSButton",
  "NSColor",
  "NSColorSampler",
  "NSColorSpace",
  "NSControl",
  "NSEvent",
  "NSGraphics",
  "NSOpenPanel",
  "NSPanel",
  "NSPrintInfo",
  "NSPrintOperation",
  "NSResponder",
  "NSSavePanel",
  "NSToolbar",
  "NSView",
  "NSVisualEffectView",
  "NSWindow",
  "NSWorkspace",
] }
objc2-web-kit = { version = "0.3", default-features = false, features = [
  "std",
  "objc2-app-kit",
  "WKPreferences",
  "WKWebView",
  "WKWebViewConfiguration",
] }
block2 = "0.6"

[dev-dependencies]
# The mock runtime, to drive the terminal commands through real IPC requests.
tauri = { version = "2", features = ["macos-private-api", "test"] }
tiny_http = "0.12.0"

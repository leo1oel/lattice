[package]
name = "research-writer"
version = "0.16.16"
description = "A local-first, agent-first scientific LaTeX writing environment"
authors = ["Leonardo"]
edition = "2021"
# The tldraw SDK in the frontend is under its own license; see ../NOTICE.
license = "Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]
# The shell and the core it ships on share this lockfile and target/, and
# `cargo test`, `cargo clippy` and `cargo fmt` here cover both.
members = ["lattice-core"]
default-members = [".", "lattice-core"]

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "research_writer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# The real-app measurement lab (src/perf_lab.rs and the frontend harness it
# drives). Only scripts/perf-lab.mjs turns it on; release builds never do.
perf-lab = ["lattice-core/perf-lab"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Halves the release binary (measured 26.6 MB -> 12.9 MB on aarch64-darwin).
# panic="abort" would save ~3 MB more but turns any panic into a hard crash
# with unsaved editor state on screen, so it stays off.
# Tuned for release *time* as well as size. Fat LTO with a single codegen unit
# is the slowest configuration cargo has — it was taking ~20 of the release
# workflow's ~27 minutes — and thin LTO across 16 units recovers most of its
# size win for a fraction of the compile. `opt-level = "s"` and symbol
# stripping, which do the bulk of the size work, are unchanged.
[profile.release]
codegen-units = 16
lto = false
opt-level = "s"
strip = "symbols"

# Full debug info made every worktree's target/ 13+ GB after a build and a test
# run, most of it DWARF for dependencies nobody steps through. Line tables for
# this crate keep file:line in backtraces (panic messages carry their location
# regardless); debuggers lose local variables. Dependencies get none: their
# frames still name the function, just without a line. `cargo test` inherits
# this through the test profile.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[dependencies]
# Everything but the shell: projects, builds, Overleaf, papers, the sidecars
# (lattice-core/Cargo.toml lists what it compiles in).
lattice-core = { path = "lattice-core" }
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-window-state = "2"
tauri-plugin-log = "2"
# Match tauri-plugin-dialog's gtk3 backend. rfd's default (xdg-portal) cannot
# be enabled at the same time as gtk3, and Cargo feature unification would
# turn both on if this crate kept the defaults.
rfd = { version = "0.16", default-features = false, features = ["gtk3"] }
log = "0.4"
tracing = { version = "0.1", default-features = false, features = ["std"] }
futures-util = { version = "0.3.33", default-features = false, features = ["std", "sink"] }
tokio = { version = "1", features = ["sync", "net", "time"] }
axum = { version = "0.8", features = ["ws"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSArray",
  "NSAttributedString",
  "NSDictionary",
  "NSRange",
  "NSGeometry",
  "NSString",
  "NSURL",
  "NSUserDefaults",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "objc2-core-foundation",
  "NSAccessibility",
  "NSAppearance",
  "NSApplication",
  "NSAttributedString",
  "NSButton",
  "NSColor",
  "NSColorSampler",
  "NSColorSpace",
  "NSControl",
  "NSEvent",
  "NSGraphics",
  "NSOpenPanel",
  "NSPanel",
  "NSPrintInfo",
  "NSPrintOperation",
  "NSResponder",
  "NSSavePanel",
  "NSToolbar",
  "NSView",
  "NSVisualEffectView",
  "NSWindow",
  "NSWorkspace",
] }
objc2-web-kit = { version = "0.3", default-features = false, features = [
  "std",
  "objc2-app-kit",
  "WKPreferences",
  "WKWebView",
  "WKWebViewConfiguration",
] }
block2 = "0.6"

[dev-dependencies]
lattice-core = { path = "lattice-core", features = ["test-support"] }
# The mock runtime, to drive the terminal commands through real IPC requests.
tauri = { version = "2", features = ["macos-private-api", "test"] }
tiny_http = "0.12.0"

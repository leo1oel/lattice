# no-mistakes pipeline config. See
# https://github.com/kunchenguid/no-mistakes (docs/.../reference/repo-config.md).
#
# `commands` and `test.instructions` are read only from the default branch, so
# edits here take effect for pipeline runs once they land on main.
#
# The test step must never launch the installed or release Lattice desktop app
# or the Tauri host: a desktop build runs with the user's real home directory
# and files. Validation stays on the frontend's own suites, the Vite frontend
# against a mocked backend, and the locally built GPUI binary on a scratch
# fixture with a scratch HOME.

commands:
  # Run worktrees start with tracked files only, so node_modules is absent.
  # The guard first (plain node, no dependencies): it writes this worktree's
  # git-ignored .cargo/config.toml, so any cargo command that compiles here
  # fails at once with the same command through scripts/gpui-build.mjs,
  # instead of writing a cold multi-GB gpui/target or src-tauri/target. The
  # instructions below alone did not stop agents from running plain cargo.
  prepare: "node scripts/run-worktree-cargo-guard.mjs install && pnpm install --frozen-lockfile"
  # The scoped gate, not the full suite: the whole Vitest suite cost 19-29
  # minutes a run here for little new signal. Pull requests run no CI; the
  # optional `pnpm signoff` covers the Rust and GPUI stages for whoever wants
  # them. `pnpm gate:changed` runs lint
  # with the warning cap, knip, typecheck, i18n, notices and rustfmt when their
  # inputs changed, and `vitest related` plus the invariant tests, against the
  # merge base with origin/main. The fetch keeps that base current so the
  # scope is the branch's own diff; offline it falls back to the local ref.
  # cargo test stays with the optional `pnpm signoff` and release CI: a Tauri
  # compile takes minutes even in the machine's shared build tree.
  test: "(git fetch --quiet origin main || true) && pnpm gate:changed"
  # gate:changed already runs `pnpm lint` in full; this keeps the lint step
  # to the one cheap check of its own rather than a second oxlint pass.
  lint: "node scripts/check-use-state-allowlist.mjs"

test:
  instructions: |
    Never launch the installed or release Lattice desktop app or the Tauri
    host. That means never running `pnpm tauri dev`, `pnpm tauri build`,
    `cargo run` in src-tauri/, any bundled Lattice.app, or the Rust host binary
    (`research-writer`, including `research-writer --browser-host`), and never
    driving a real-app session (including Playwright WebKit or CDP attached to
    a running Lattice host). A desktop build reaches the user's real home
    directory and files. The locally built GPUI binary
    (`gpui/target/release/lattice-gpui`) and its offscreen `e2e` scenario may
    run, on a scratch copy of `gpui/fixtures/e2e` with a scratch HOME
    (`gpui/script/e2e` does both).

    Build that binary with `node scripts/gpui-build.mjs` from the worktree
    root, never with `cargo build` in the run worktree: it builds in the
    machine's shared, already warm GPUI build tree under the machine-wide
    lock and copies the binary back to `gpui/target/release/lattice-gpui`
    (seconds to a few minutes; a cold build in a new run worktree took
    longer than this step had left). Run it in the foreground and wait for
    it: do not background it and end your turn. If a command timeout stops
    it, run it again; the shared tree keeps what was already built. It
    prints "waiting for the GPUI release build lock held by <holder>" every
    minute while another checkout's build holds the lock; wait for it rather
    than starting a second build.

    Run every other cargo command that compiles (check, clippy, test, build)
    the same way, never with plain `cargo` in the run worktree, where it
    writes a cold multi-GB `gpui/target` or `src-tauri/target` that fills the
    machine's disk:
    - GPUI workspace: `node scripts/gpui-build.mjs -- test --release --locked
      --workspace --features lattice-gpui/offscreen-shots` (or `-- clippy
      --workspace ...`, `-- test -p lattice-ui ...`);
    - Tauri crates: `node scripts/gpui-build.mjs -- clippy --manifest-path
      src-tauri/Cargo.toml --all-targets --all-features -- -D warnings` or
      `-- test --manifest-path src-tauri/Cargo.toml --package research-writer`.
    `cargo fmt` builds nothing and may run directly. A plain cargo command
    that compiles fails here at once (the prepare command's guard) and prints
    the gpui-build command to run instead; run that.

    The configured test command is the scoped gate (`pnpm gate:changed`), not
    the full suite: do not run `pnpm test` or the whole Vitest suite here.

    For a change under `gpui/` (or `src-tauri/lattice-core/`), run a light
    pass, not the full suite; the full e2e and the gate run once per merge on
    main instead (`scripts/gpui-main-baseline.mjs`):
    1. `node scripts/gpui-build.mjs -- clippy --release --locked -p <each
       changed crate> --no-deps --all-targets`, adding `--features
       lattice-gpui/offscreen-shots` when `lattice-gpui` is among them. Main
       is not clippy-clean (about 90 warnings in lattice-gpui, more in
       trellis), so do not pass `-D warnings`, and report only warnings in
       lines the branch changed;
    2. the unit tests of the changed crates only: `node scripts/gpui-build.mjs
       -- test --release --locked -p <each changed crate>`, with the same
       feature for `lattice-gpui`. A test that runs past the per-test limit
       (300 s) is stopped and fails naming itself; report it, do not re-run it;
    3. `node scripts/gpui-e2e-light.mjs`, once: it builds the release
       binary, runs the e2e scenario's smoke flow plus only the modules the
       change touches (`gpui/script/e2e --only <modules>`, the path map in
       `scripts/gpui-e2e-modules.mjs`), retries once when only quarantined
       steps (`scripts/gpui-e2e-quarantine.json`) failed, and sorts what still
       fails against the main baseline. It exits 1 only for failures that are
       the branch's own, and lists the pre-existing ones. Never run the full
       e2e scenario here (no `gpui/script/e2e` without `--only`), and do not
       build or run main to compare.
    The main baseline is `known-failures@<sha>.json` for the branch's merge
    base with origin/main, or `latest.json`, in
    `~/Library/Caches/lattice-gpui-build/main-baseline/`. A failing gate stage
    in its `gate.failing` or an e2e step in its `e2e.failing` is pre-existing:
    record it as pre-existing on main, naming the baseline file, and move on
    without asking or fixing it. When no baseline covers the merge base, say
    so and treat only failures in code the branch changed as its own.

    Verify changes only with:
    - the configured test and lint commands;
    - targeted unit and integration tests (`pnpm vitest run <file>`), which run
      under jsdom with a mocked Tauri `invoke`;
    - browser-only checks of the Vite frontend (`pnpm dev`) against a mocked
      backend that the check itself supplies (for example `mockIPC` from
      `@tauri-apps/api/mocks`), with no Tauri host process behind it. Never
      connect the page to a real host through the browser-host bridge
      (`src/platform/browser-runtime.ts`).

    If a change can only be verified in the real desktop app, say so in the
    test report instead of launching it.

# The review agent compiles too, to check a finding: a plain `cargo test` or
# `cargo clippy` there left an 8-10 GB gpui/target (or 2-3 GB src-tauri/target)
# in each run worktree. These blocks are added only when the diff touches them.
review:
  path_instructions:
    - path: "gpui/**"
      instructions: |
        To compile anything in the GPUI workspace (check, clippy, test,
        build), run cargo through `node scripts/gpui-build.mjs -- <cargo
        arguments>` from the worktree root, for example
        `node scripts/gpui-build.mjs -- test --release --locked --workspace
        --features lattice-gpui/offscreen-shots`, never plain `cargo` in
        gpui/: it builds in the machine's shared, warm build tree under the
        machine-wide lock instead of a cold multi-GB gpui/target in this run
        worktree. Run it in the foreground and wait for it. `cargo fmt`
        builds nothing and may run directly.
    - path: "src-tauri/**"
      instructions: |
        To compile the Tauri crates (check, clippy, test), run cargo through
        `node scripts/gpui-build.mjs -- <cargo arguments> --manifest-path
        src-tauri/Cargo.toml` from the worktree root, for example
        `node scripts/gpui-build.mjs -- clippy --manifest-path
        src-tauri/Cargo.toml --all-targets --all-features -- -D warnings`,
        never plain `cargo` here: it builds in the machine's shared, warm
        build tree under the machine-wide lock instead of a cold multi-GB
        src-tauri/target in this run worktree. Never run the Tauri host
        (`cargo run`, `pnpm tauri dev`). `cargo fmt` builds nothing and may
        run directly.
